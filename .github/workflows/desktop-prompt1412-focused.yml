name: Fixed official1412 adopted Prompt runtime verification
on:
  push:
    branches: ['codex/desktop-prompt1412-runtime-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prompt1412-${{ github.ref }}
  cancel-in-progress: true
jobs:
  affected:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind synthetic canonical NTFS temporary directory
        shell: pwsh
        run: |
          $root = Join-Path ($env:SystemDrive + '\') ('pm' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($root)).DriveFormat -ne 'NTFS') { throw 'NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          @("TEMP=$root", "TMP=$root") | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Compile shared and production Desktop tests
        working-directory: app
        run: .\gradlew.bat :sharedCore:compileTestKotlin :desktopApp:compileTestKotlin --no-daemon --stacktrace --console=plain
      - name: Verify logical envelopes nullable modes and final serialization
        if: ${{ !cancelled() }}
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain
          --tests 'com.example.chatbar.domain.prompt.FormatRepairPromptContractTest'
      - name: Verify actual runtime regeneration production composer and nearby custody
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          CCB_NARRATIVE_MODE_REVIEW_DIR: ${{ runner.temp }}/prompt1412-ui-review
        run: >-
          .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain
          --tests 'com.example.chatbar.desktop.DesktopActionOptionsRequestTest.code malformed*'
          --tests 'com.example.chatbar.desktop.DesktopFakeChatRuntimeTest.sharedFormatWorldBookPlayerAndUserToolPoliciesReachCapturedRequest'
          --tests 'com.example.chatbar.desktop.DesktopPhase7ImagesTest.explicit compatible*'
          --tests 'com.example.chatbar.desktop.DesktopRealChatRuntimeTest.restart blank continue*'
          --tests 'com.example.chatbar.desktop.DesktopNarrativeModeComposerTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt1412-original-results
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
            app/desktopApp/build/test-results/test/
            app/desktopApp/build/reports/tests/test/
            ${{ runner.temp }}/prompt1412-ui-review/
          if-no-files-found: warn
