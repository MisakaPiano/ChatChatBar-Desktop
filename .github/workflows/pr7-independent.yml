name: PR7 independent review fixes
on:
  push:
    branches: [validation/pr7-independent-fixes-20261116]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CHATBAR_VERSION_NAME: 1.4.12-pr7-independent
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/pr7_independent.py /tmp/pr7_independent.py
      - uses: actions/checkout@v4
        with:
          ref: 1a59e7cc2b95ffb4c11d8ad60250eff771594cfb
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python /tmp/pr7_independent.py prepare
      - name: Validate fixed JVM and compile native tests
        run: |
          python /tmp/pr7_independent.py fixed-jvm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce R1 using completed real switch job on API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_independent.py baseline-native
      - name: Fixed R1 and delete redo real narrow row on API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_independent.py fixed-native-api30
      - name: Fixed delete redo image controls and narrow row on API26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_independent.py fixed-native-api26
      - run: python /tmp/pr7_independent.py package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-independent-originals
          path: |
            pr7-independent/
            app/app/build/reports/tests/
            app/app/build/outputs/androidTest-results/
          retention-days: 14
