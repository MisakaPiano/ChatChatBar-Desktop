name: PR7 independent final JVM and build
on:
  push:
    branches: [validation/pr7-independent-fixes-20261116]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CHATBAR_VERSION_NAME: 1.4.12-pr7-independent
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/pr7_independent.py /tmp/pr7_independent.py
      - uses: actions/checkout@v4
        with:
          ref: ca8afca55c24dbd90a86320adc28f21717925655
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python /tmp/pr7_independent.py prepare
      - name: Validate fixed JVM and compile native tests
        run: |
          python /tmp/pr7_independent.py fixed-jvm
      - name: Record built APK identity and signature without a duplicate APK upload
        run: python /tmp/pr7_independent.py package-metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-independent-originals
          path: |
            pr7-independent/
            app/app/build/reports/tests/
            app/app/build/outputs/androidTest-results/
          retention-days: 14
