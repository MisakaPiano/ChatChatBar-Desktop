name: Upstream NAI targeted checks
on:
  push:
    branches: [ci/upstream-nai-targeted]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact upstream contribution commit
        required: true
        type: string
env:
  SOURCE_SHA: ${{ inputs.source_sha || '567ff1939ec2a5621bbbc8dd7d5f06e079a942b7' }}
jobs:
  targeted-high-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test only affected pricing and balance paths
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash ./gradlew :app:testDebugUnitTest --tests '*NovelAiHighActionPricingTest' --tests '*NovelAiImageCostEstimatorTest' --tests '*NovelAiMediumPricingTest' --tests '*NovelAiPostProcessTest' --tests '*NovelAiAccountUiStateTest' --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-nai-high-action-${{ github.run_id }}
          path: |
            app/app/build/test-results/testDebugUnitTest/
            app/app/build/reports/tests/testDebugUnitTest/
