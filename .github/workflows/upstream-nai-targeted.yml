name: Upstream NAI targeted checks
on:
  push:
    branches: [ci/upstream-nai-targeted]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact upstream contribution commit
        required: true
        type: string
jobs:
  targeted:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || 'e4d7997c05f77e31b8650935830acc583c112f89' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android and run affected production-path tests
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*NovelAi*Test' :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-nai-results
          path: |
            app/app/build/test-results/testDebugUnitTest/
            app/app/build/reports/tests/testDebugUnitTest/
