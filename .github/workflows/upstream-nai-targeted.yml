name: Upstream NAI targeted checks
on:
  push:
    branches: [ci/upstream-nai-targeted]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact upstream contribution commit
        required: true
        type: string
env:
  SOURCE_SHA: ${{ inputs.source_sha || '892b478b17d3bf0943e779d3f14108b750f3355c' }}
jobs:
  targeted:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact source and affected NAI production paths
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash ./gradlew :app:testDebugUnitTest --tests '*NovelAi*Test' :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-nai-review-unit-${{ github.run_id }}
          path: |
            app/app/build/test-results/testDebugUnitTest/
            app/app/build/reports/tests/testDebugUnitTest/
  review-ui:
    needs: targeted
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable cloud runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            cd app
            bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.chatbar.ui.imageprompt.NovelAiReviewRegressionTest --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8'
            git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-nai-review-ui-${{ github.run_id }}
          path: |
            app/app/build/outputs/androidTest-results/connected/
            app/app/build/reports/androidTests/connected/
