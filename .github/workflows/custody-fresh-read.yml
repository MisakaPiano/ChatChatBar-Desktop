          assert all(int(suite.get(k, '0')) == value for k, value in counts.items()), 'ORIGINAL_COUNT_MISMATCH'
          assert len(cases) == 1 and cases[0].get('classname') == name and cases[0].get('name') == method, 'EXACT_ORIGINAL_NOT_EXECUTED'
          result = {'head': os.environ['CHECKED_HEAD'], 'class': name, 'method': method, **counts}
          (root / 'custody-large-case-verification.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result))
          assert counts == {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0}, 'ORIGINAL_NOT_PASS'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-group-cloud-large-resource-evidence
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/

  group-large-resources:
    needs: authority-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCB_GROUP_LARGE_PROOF: 'true'
      CCB_GROUP_LARGE_TLS_PROOF: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fully written encrypted group and native v8 proof
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :sharedCore:test --tests 'com.example.chatbar.domain.syncStoreProof.SyncGroupLargeNativeProofTest' --rerun-tasks --no-build-cache --no-daemon --stacktrace
      - name: Verify the exact executed original large case
        if: always()
        env:
          CHECKED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          name = 'com.example.chatbar.domain.syncStoreProof.SyncGroupLargeNativeProofTest'
          method = 'actualEncryptedGroupObjectsAndNativeUnitsReopenOverOneGiBAfterInterruptedUploadAndSourceDeletion'
          root = Path('app/sharedCore/build/test-results/test')
          suite = ET.parse(root / ('TEST-' + name + '.xml')).getroot()
