          assert len(cases) == 1 and cases[0].get('classname') == name and cases[0].get('name') == method, 'EXACT_ORIGINAL_NOT_EXECUTED'
          result = {'head': os.environ['CHECKED_HEAD'], 'class': name, 'method': method, **counts}
          (root / 'custody-large-case-verification.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result))
          assert counts == {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0}, 'ORIGINAL_NOT_PASS'
          PY
      - uses: actions/upload-artifact@v4
