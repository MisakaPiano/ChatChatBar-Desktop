name: Desktop 1260 combined affected verification
on:
  push:
    branches: [codex/desktop-candidate-1260-combined-20261121]
    paths:
      - '**/*.kt'
      - '.github/workflows/desktop-candidate-1260-affected.yml'
      - '.github/desktop-candidate-1260-composition.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind isolated NTFS source and synthetic temporary data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path ($env:SystemDrive + '\') ('ccb1260-' + [Guid]::NewGuid().ToString('N'))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($base)).DriveFormat -ne 'NTFS') { throw 'NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $base -ErrorAction Stop | Out-Null
          $temp = New-Item -ItemType Directory -Path (Join-Path $base 'temp') -ErrorAction Stop
          $source = Join-Path $base 'source'
          git worktree add --detach $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'EXACT_SOURCE_WORKTREE_FAILED' }
          New-Item -ItemType Directory -Path 'review1260' -ErrorAction Stop | Out-Null
          [ordered]@{source=(git rev-parse HEAD);tree=(git rev-parse 'HEAD^{tree}');nativeFileSystem='NTFS';syntheticOnly=$true;humanAcceptance=$false} | ConvertTo-Json | Set-Content review1260/source.json -Encoding utf8
          @("TEMP=$($temp.FullName)", "TMP=$($temp.FullName)", "CCB_COMBINED_SOURCE=$source") | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Verify affected annotation service and its actual Desktop consumers
        working-directory: ${{ env.CCB_COMBINED_SOURCE }}/app
        shell: pwsh
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests 'com.example.chatbar.domain.image.NovelAiPromptTranslationTest'
          :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopStudioImportedAnnotationTest'
          --tests 'com.example.chatbar.desktop.DesktopStudioInputHistorySceneTest'
          --tests 'com.example.chatbar.desktop.DesktopNovelAiCatalogUpdateTest'
          --tests 'com.example.chatbar.desktop.DesktopCatalogUpdatesTest'
          --tests 'com.example.chatbar.desktop.DesktopDesignParityTest'
          --tests 'com.example.chatbar.desktop.DesktopCharacterImagePromptFieldTest'
          --tests 'com.example.chatbar.desktop.DesktopStudioTranslatedCaretTest'
          --tests 'com.example.chatbar.desktop.DesktopStudioWorkspaceTest'
          -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain
      - name: Collect original reports onto the artifact volume
        if: always() && env.CCB_COMBINED_SOURCE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($module in @('sharedCore', 'desktopApp')) {
            $reports = Join-Path $env:CCB_COMBINED_SOURCE "app/$module/build/test-results/test"
            if (Test-Path -LiteralPath $reports) {
              Copy-Item -LiteralPath $reports -Destination "review1260/$module" -Recurse
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-1260-affected-original-reports
          path: review1260/
          if-no-files-found: error
