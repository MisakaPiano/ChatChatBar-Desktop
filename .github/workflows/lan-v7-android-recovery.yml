name: V7 Android original recovery code after an in-place upgrade
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths:
      - .github/workflows/lan-v7-android-recovery.yml
      - tools/lan-next-control/v7_android_recovery_control.py
permissions:
  contents: read
  actions: read
jobs:
  android-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Authenticate the two delivered APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/lan-next-control/v7_android_scan_inputs.py --with-base85
      - name: Enable cloud emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Save the original synthetic code in memory, upgrade in place, and unlock
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            python -B tools/lan-next-control/v7_android_recovery_control.py --adb adb --serial emulator-5554 --base-apk "$RUNNER_TEMP/ccb-v7-scan/base85.apk" --candidate-apk "$RUNNER_TEMP/ccb-v7-scan/candidate86.apk" --ui-helper-sha256 ee84dec25c6f83ab628a981afd1dcbc8aa281ed15e508eaa93176676806c808a --result "$RUNNER_TEMP/ccb-v7-scan/android-recovery-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-android-recovery-safe-result
          path: ${{ runner.temp }}/ccb-v7-scan/android-recovery-result.json
          if-no-files-found: ignore
