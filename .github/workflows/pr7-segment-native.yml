name: PR7 segment removal native checks
on:
  push:
    branches: [validation/pr7-segment-voice-20261118]
concurrency:
  group: pr7-segment-voice-native
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - phase: baseline-native
            api: 30
          - phase: fixed-native-api30
            api: 30
          - phase: fixed-native-api26
            api: 26
    env:
      CHATBAR_VERSION_NAME: 1.4.12-pr7-segment-voice
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/pr7_segment_voice.py /tmp/pr7_segment_voice.py
      - uses: actions/checkout@v4
        with:
          ref: efa6ffbb20cfc52096f0f5df03b41c419fc14e4a
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the same SDK packages as upstream CI
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: python /tmp/pr7_segment_voice.py prepare
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run only the outstanding native check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_segment_voice.py ${{ matrix.phase }}
      - name: Verify final standard package and signature
        if: matrix.phase != 'baseline-native'
        run: python /tmp/pr7_segment_voice.py package-metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-segment-voice-${{ matrix.phase }}-originals
          path: |
            pr7-segment-voice/
            app/app/build/outputs/androidTest-results/
          retention-days: 14
