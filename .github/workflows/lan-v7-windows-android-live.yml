name: V7 Windows to exact Android live group pairing
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths:
      - .github/lan-v7-live-pair-request.json
      - .github/workflows/lan-v7-windows-android-live.yml
      - tools/lan-next-control/v7_live_pair_android.py
      - tools/lan-next-control/v7_original86_ui_observation.py
      - tools/lan-next-control/test_v7_original86_ui_observation.py
      - tools/lan-next-control/synthetic_clipboard/**
      - tools/lan-next-control/v7_windows_live_pair_control.py
      - tools/lan-next-control/fixtures/DesktopV7LiveSyntheticHostDraftTest.kt
permissions:
  contents: read
  actions: read
jobs:
  live-pair:
    runs-on: windows-latest
    timeout-minutes: 48
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: v7-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MisakaPiano/ChatChatBar-Desktop
          ref: f7d8776606dd4dc03ef8f7f0c1dc3c30afd6f2ac
          path: v7-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator system-images;android-26;google_apis;x86_64 platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Authenticate the distributed APK and prepare only the fixed Windows test overlay
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: v7-control
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/v7_android_scan_inputs.py
          if ($LASTEXITCODE) { throw 'V7_EXACT_APK' }
          python -B tools/lan-next-control/v7_windows_live_pair_control.py prepare --request .github/lan-v7-live-pair-request.json --source ../v7-source --evidence evidence-live
          if ($LASTEXITCODE) { throw 'V7_LIVE_PREPARE' }
          $sdk = $env:ANDROID_HOME
          if (!$sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          python -B tools/lan-next-control/synthetic_clipboard/build_clipboard_helper.py --sdk $sdk --java-home $env:JAVA_HOME --private-root (Join-Path $env:RUNNER_TEMP 'ccb-v7-clipboard') --safe-result (Join-Path (Resolve-Path -LiteralPath evidence-live).Path 'android-clipboard-build.json')
          if ($LASTEXITCODE) { throw 'V7_CLIPBOARD_HELPER_BUILD' }
      - name: Exercise one real private-network invitation in the fixed Windows runtime and delivered APK
        env:
          CCB_V7_LIVE_SYNTHETIC: 'true'
          CCB_V7_SOURCE_SHA: f7d8776606dd4dc03ef8f7f0c1dc3c30afd6f2ac
        working-directory: v7-control
        timeout-minutes: 32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ccb-v7-live'
          $null = New-Item -ItemType Directory -Path $root
          $env:ANDROID_AVD_HOME = (New-Item -ItemType Directory -Path (Join-Path $root 'avd')).FullName
          $sdk = $env:ANDROID_HOME
          if (!$sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $emulator = Join-Path $sdk 'emulator\emulator.exe'
          $adb = Join-Path $sdk 'platform-tools\adb.exe'
          $vm = $null; $android = $null
          try {
            'no' | avdmanager create avd --name CCBV7Live --package 'system-images;android-26;google_apis;x86_64'
            if ($LASTEXITCODE) { throw 'LIVE_AVD_CREATE' }
            $argsForLive = @('-avd','CCBV7Live','-port','5554','-no-window','-no-audio','-no-snapshot','-no-boot-anim','-accel','on','-gpu','swiftshader_indirect','-memory','1536','-cores','2')
            $vm = Start-Process -FilePath $emulator -ArgumentList $argsForLive -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $root 'emulator-stdout.txt') -RedirectStandardError (Join-Path $root 'emulator-stderr.txt')
            $clock = [Diagnostics.Stopwatch]::StartNew(); $booted = $false
            while ($clock.Elapsed.TotalSeconds -lt 310) {
              if ($vm.HasExited) { throw 'LIVE_EMULATOR_EXITED' }
              $boot = & $adb -s emulator-5554 shell getprop sys.boot_completed 2>$null
              if ($LASTEXITCODE -eq 0 -and "$boot".Trim() -eq '1') { $booted = $true; break }
              Start-Sleep -Seconds 4
            }
            if (!$booted) { throw 'LIVE_EMULATOR_BOOT_EXPIRED' }
            & $adb -s emulator-5554 shell svc power stayon true
            if ($LASTEXITCODE) { throw 'LIVE_EMULATOR_AWAKE' }
            & $adb -s emulator-5554 shell input keyevent 82 | Out-Null
            & $adb -s emulator-5554 shell wm size 1080x2160
            if ($LASTEXITCODE) { throw 'LIVE_EMULATOR_SIZE' }
            & $adb -s emulator-5554 shell wm density 320
            if ($LASTEXITCODE) { throw 'LIVE_EMULATOR_DENSITY' }
            $priorCcb = & $adb -s emulator-5554 shell pm list packages com.example.chatbar
            if ($LASTEXITCODE -or "$priorCcb".Trim()) { throw 'LIVE_FRESH_PACKAGE_REQUIRED' }
            & $adb -s emulator-5554 install (Join-Path $env:RUNNER_TEMP 'ccb-v7-scan/candidate86.apk')
            if ($LASTEXITCODE) { throw 'LIVE_APK_INSTALL' }
            $env:CCB_V7_CLEAN_ANDROID_INSTALL = 'true'
            $info = [Diagnostics.ProcessStartInfo]::new((Get-Command python).Source)
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.WorkingDirectory = (Get-Location).Path
            $resultDir = (Resolve-Path -LiteralPath 'evidence-live').Path
            foreach ($arg in @('-B','tools/lan-next-control/v7_live_pair_android.py','--adb',$adb,'--serial','emulator-5554','--helper-build',(Join-Path $env:RUNNER_TEMP 'ccb-v7-clipboard/helper-build.json'),'--offer',(Join-Path $root 'live-offer.json'),'--ready',(Join-Path $root 'android-ready.json'),'--readback',(Join-Path $root 'android-readback.json'),'--result',(Join-Path $resultDir 'android-result.json'))) { $info.ArgumentList.Add($arg) }
            $android = [Diagnostics.Process]::Start($info)
            $ready = Join-Path $root 'android-ready.json'
            $preflight = [Diagnostics.Stopwatch]::StartNew()
            while (!$android.HasExited -and !(Test-Path -LiteralPath $ready) -and $preflight.Elapsed.TotalSeconds -lt 140) {
              Start-Sleep -Seconds 2
            }
            if (!(Test-Path -LiteralPath $ready)) { throw 'LIVE_ANDROID_JOIN_FORM_NOT_READY' }
            python -B tools/lan-next-control/v7_windows_live_pair_control.py run --request .github/lan-v7-live-pair-request.json --source ../v7-source --evidence evidence-live
            $desktopExit = $LASTEXITCODE
            if ($desktopExit -and (Test-Path -LiteralPath evidence-live/gradle-original.log)) {
              Get-Content -LiteralPath evidence-live/gradle-original.log | Where-Object { $_ -match '^e: .*DesktopV7LiveSyntheticHostDraftTest\.kt:' } | Select-Object -First 8
            }
            if (!$android.WaitForExit(200000)) { throw 'LIVE_ANDROID_DID_NOT_FINISH' }
            if ($desktopExit -or $android.ExitCode) { throw 'LIVE_PAIR_OR_PAYLOAD_FAILED' }
          } finally {
            foreach ($leaf in @('windows-result.json')) {
              $report = Join-Path $root $leaf
              if (Test-Path -LiteralPath $report) { Copy-Item -LiteralPath $report -Destination evidence-live }
            }
            if ($android -and !$android.HasExited) { $android.Kill() }
            if ($vm) {
              & $adb -s emulator-5554 emu kill 2>$null | Out-Null
              if (!$vm.WaitForExit(10000)) { $vm.Kill() }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-cross-platform-live-safe-results
          path: |
            v7-control/evidence-live/prepared.json
            v7-control/evidence-live/verified.json
            v7-control/evidence-live/windows-result.json
            v7-control/evidence-live/android-result.json
            v7-control/evidence-live/android-clipboard-build.json
            v7-control/evidence-live/android-progress.json
          if-no-files-found: ignore
