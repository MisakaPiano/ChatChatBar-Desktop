name: Desktop 1259 feedback source navigation
on:
  push:
    branches: [codex/desktop-1259-feedback-20261119, codex/desktop-1259-review-proof-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop1259-feedback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind native canonical synthetic temporary directory
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ccb1259-feedback-fixtures'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Add-Type 'using System.Text; using System.Runtime.InteropServices; public static class FeedbackFixturePath { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetLongPathName(string path, StringBuilder result, uint size); }'
          $buffer = New-Object System.Text.StringBuilder 32768
          if ([FeedbackFixturePath]::GetLongPathName($folder, $buffer, 32768) -eq 0) { throw 'FIXTURE_NATIVE_PATH_UNCONFIRMED' }
          "TEMP=$buffer" >> $env:GITHUB_ENV
          "TMP=$buffer" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path '.review1259' | Out-Null
          git rev-parse HEAD | Set-Content '.review1259/source.txt'
      - name: Reproduce both new Primary failures on the unchanged prior product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '4486b326683bc4dba3b71d7127612ff65dcbc521'
          $files = @(
            'app/sharedCore/src/main/kotlin/com/example/chatbar/data/repository/VoiceMessageRepository.kt',
            'app/sharedCore/src/main/kotlin/com/example/chatbar/data/repository/ChatRepository.kt',
            'app/sharedCore/src/main/kotlin/com/example/chatbar/domain/voice/VoiceMessageVersionPolicy.kt',
            'app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopPrimaryChatController.kt'
          )
          git fetch origin $base --depth=1
          git restore --source=$base --worktree -- $files
          $base | Set-Content '.review1259/negative-product-source.txt'
          try {
            Push-Location app
            try {
              .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopRemovedAlternativeVoiceTest.same dialogue legacy playback inference never authorizes deletion of its unique audio' --tests 'com.example.chatbar.desktop.DesktopRemovedAlternativeVoiceTest.durable source with failed session summary still refreshes and cleans proven version audio' -PdesktopTestHeadless=true --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            if ($negativeExit -ne 1) { throw 'PRIOR_PRODUCT_NEGATIVE_EXIT_NOT_CONFIRMED' }
            $xmlPath = 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopRemovedAlternativeVoiceTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $xmlPath
            if ($report.testsuite.tests -ne '2' -or $report.testsuite.failures -ne '2' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'PRIOR_PRODUCT_TWO_ASSERTION_FAILURES_NOT_CONFIRMED' }
            if (@($report.testsuite.testcase.failure | Where-Object type -NotMatch 'Assertion').Count -ne 0) { throw 'PRIOR_PRODUCT_FAILURE_NOT_ASSERTION' }
            Copy-Item -LiteralPath $xmlPath -Destination '.review1259/negative-primary-voice.xml'
          } finally {
            git restore --source=HEAD --worktree -- $files
            git diff --exit-code -- $files
            if ($LASTEXITCODE -ne 0) { throw 'POSITIVE_PRODUCT_NOT_RESTORED' }
          }
      - name: Reproduce inactive alternative redo checkpoint loss
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = '646831afa55485ad3344475d525004b9c00aeda9'
          $file = 'app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopMessageFormatRepairController.kt'
          git fetch origin $prior --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'REDO_PRIOR_UNAVAILABLE' }
          try {
            git restore --source=$prior --worktree -- $file
            Push-Location app
            try {
              .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopFormatRepairInteractionTest.inactive alternative redo checkpoint survives no change unchanged marker and error on another alternative' -PdesktopTestHeadless=true --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            $path = 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopFormatRepairInteractionTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $path
            if ($negativeExit -ne 1 -or $report.testsuite.tests -ne '1' -or $report.testsuite.failures -ne '1' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'REDO_PRIOR_ASSERTION_NOT_REACHED' }
            if ($report.testsuite.testcase.failure.message -notlike '*Repairing B without a replacement erased*') { throw 'REDO_PRIOR_WRONG_FAILURE' }
            Copy-Item -LiteralPath $path -Destination '.review1259/negative-other-version-redo.xml'
            $prior | Set-Content '.review1259/negative-other-version-source.txt'
          } finally { git restore --source=HEAD --worktree -- $file }
      - name: Verify shared version voice custody
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests 'com.example.chatbar.domain.voice.VoiceRepositoryPersistenceTest'
          --tests 'com.example.chatbar.domain.voice.VoiceMessageVersionPolicyTest'
          --tests 'com.example.chatbar.data.repository.ChatRepositoryConditionalUpdateTest'
          --no-daemon --stacktrace
      - name: Verify actual primary viewport and gallery source action
        working-directory: app
        env:
          CCB_SOURCE_NAVIGATION_REVIEW_DIR: ${{ github.workspace }}/.review1259
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopSourceMessageNavigationTest'
          --tests 'com.example.chatbar.desktop.DesktopSessionImageGalleryTest'
          --tests 'com.example.chatbar.desktop.DesktopChatViewportTest'
          --tests 'com.example.chatbar.desktop.DesktopChatReadingLifecycleTest'
          --tests 'com.example.chatbar.desktop.DesktopChatFloatingNavigationTest'
          --tests 'com.example.chatbar.desktop.DesktopSessionDeletionTargetPresentationTest'
          --tests 'com.example.chatbar.desktop.DesktopSessionDeletionControllerTest'
          --tests 'com.example.chatbar.desktop.DesktopPrimaryChatControllerTest'
          --tests 'com.example.chatbar.desktop.DesktopFormatRepairInteractionTest'
          --tests 'com.example.chatbar.desktop.DesktopSessionCommitJournalTest'
          --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest'
          --tests 'com.example.chatbar.desktop.DesktopRemovedAlternativeVoiceTest'
          -PdesktopTestHeadless=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop1259-feedback-original-results
          include-hidden-files: true
          path: |
            app/sharedCore/build/test-results/test/
            app/desktopApp/build/test-results/test/
            .review1259/
