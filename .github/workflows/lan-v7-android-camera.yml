name: V7 signed Android invitation camera path
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths:
      - .github/workflows/lan-v7-android-camera.yml
      - tools/lan-next-control/v7_scan_camera_control.py
permissions:
  contents: read
  actions: read
jobs:
  android-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify the original signed 86 APK and make a synthetic camera frame
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -B tools/lan-next-control/v7_android_scan_inputs.py
          python -m pip install --disable-pip-version-check 'qrcode==8.2' 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
          python -m pip install --only-binary=:all: --no-deps --disable-pip-version-check 'zxing-cpp==2.3.0'
          python -B tools/lan-next-control/v7_make_invalid_qr.py --output "$RUNNER_TEMP/ccb-v7-scan/qr.png"
          encoder="$(python -B -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$encoder" -hide_banner -loglevel error -loop 1 -i "$RUNNER_TEMP/ccb-v7-scan/qr.png" -t 240 -r 15 -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/ccb-v7-scan/qr.mp4"
      - name: Enable cloud emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the real camera invitation action in the delivered APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front none -camera-back videofile:${{ runner.temp }}/ccb-v7-scan/qr.mp4
          script: bash tools/lan-next-control/v7_camera_preview_observe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-android-camera-safe-results-api36
          path: |
            ${{ runner.temp }}/ccb-v7-scan/camera-result.json
            ${{ runner.temp }}/ccb-v7-scan/camera-preview-result.json
          if-no-files-found: ignore
