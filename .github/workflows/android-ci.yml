name: Android and Windows Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and package debug APK
        env:
          CHATBAR_SUPABASE_URL: ${{ secrets.CHATBAR_SUPABASE_URL || 'https://rrlxofrrgfnhjfyrqvry.supabase.co' }}
          CHATBAR_SUPABASE_ANON_KEY: ${{ secrets.CHATBAR_SUPABASE_ANON_KEY || 'sb_publishable_J56aQ_JJLnank-dv1olMdg_d87xNQjD' }}
        run: ./gradlew :sharedCore:test :app:test :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chatbar-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/app/build/reports/tests/
            app/app/build/reports/problems/
            app/sharedCore/build/reports/tests/
            app/sharedCore/build/test-results/

  desktop:
    name: Windows Desktop tests
    runs-on: windows-latest
    env:
      # All native credential cases use task-owned synthetic temporary roots.
      CCB_PREVIEW_NATIVE_DPAPI: "1"
    steps:
      - name: Enable long-path Git checkout on this runner
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare supported NTFS workspace and record native prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          $jvmSettings = (& java -XshowSettings:properties -version 2>&1 | Out-String)
          $originalTemp = [regex]::Match($jvmSettings, 'java.io.tmpdir\s*=\s*(.+)').Groups[1].Value.Trim()
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class DesktopCiNativePrerequisites {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)] static extern uint GetLongPathName(string path, StringBuilder result, uint size);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)] static extern SafeFileHandle CreateFile(string path, uint access, uint sharing, IntPtr security, uint creation, uint flags, IntPtr template);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)] static extern uint GetFinalPathNameByHandle(SafeFileHandle handle, StringBuilder result, uint size, uint flags);
            [DllImport("winmm.dll")] public static extern uint waveOutGetNumDevs();
            public static string LongPath(string path) { var b=new StringBuilder(32768); return GetLongPathName(path,b,32768)>0 ? b.ToString() : null; }
            public static string FinalPath(string path) { using(var h=CreateFile(path,0x80,7,IntPtr.Zero,3,0x02000000,IntPtr.Zero)) { if(h.IsInvalid)return null; var b=new StringBuilder(32768); return GetFinalPathNameByHandle(h,b,32768,0)>0 ? b.ToString() : null; } }
          }
          '@
          $ciRoot = Join-Path ($env:SystemDrive + '\') ('c' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          $volume = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($ciRoot))
          if ($volume.DriveFormat -ne 'NTFS') { throw 'DESKTOP_TEST_NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $ciRoot -ErrorAction Stop | Out-Null
          $testTemp = New-Item -ItemType Directory -Path (Join-Path $ciRoot 'temp') -ErrorAction Stop
          $source = Join-Path $ciRoot 'source'
          git worktree add --detach $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_NTFS_WORKTREE_FAILED' }
          $facts = [ordered]@{
            originalJvmTemp = $originalTemp
            originalLongPath = [DesktopCiNativePrerequisites]::LongPath($originalTemp)
            originalFinalPath = [DesktopCiNativePrerequisites]::FinalPath($originalTemp)
            originalTempAttributes = [string][IO.File]::GetAttributes($originalTemp)
            workspaceVolumeFormat = ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))).DriveFormat
            selectedVolumeFormat = $volume.DriveFormat
            selectedTemp = $testTemp.FullName
            selectedFinalPath = [DesktopCiNativePrerequisites]::FinalPath($testTemp.FullName)
            nativeWaveOutputDevices = [DesktopCiNativePrerequisites]::waveOutGetNumDevs()
            sourceCommit = (git rev-parse HEAD)
          }
          $facts | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'desktop-native-prerequisites.json') -Encoding utf8
          $facts | ConvertTo-Json
          @("TEMP=$($testTemp.FullName)", "TMP=$($testTemp.FullName)", "CCB_CI_SOURCE=$source") | Add-Content $env:GITHUB_ENV -Encoding utf8

      - name: Upload Windows prerequisite facts
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-prerequisites
          path: ${{ runner.temp }}/desktop-native-prerequisites.json

      - name: Test Desktop on Windows
        working-directory: ${{ env.CCB_CI_SOURCE }}/app
        run: .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=true --no-daemon --stacktrace

      - name: Test NSIS manager lifecycle with synthetic programs
        if: ${{ !cancelled() && env.CCB_CI_SOURCE != '' }}
        working-directory: ${{ env.CCB_CI_SOURCE }}
        run: python -m unittest discover -s tools/desktop/nsis -p test_lifecycle.py -v

      - name: Test Desktop trusted updater and native exit handoff
        if: ${{ !cancelled() && env.CCB_CI_SOURCE != '' }}
        working-directory: ${{ env.CCB_CI_SOURCE }}
        run: |
          python tools/desktop/update/prepare_runtime.py --destination "$env:RUNNER_TEMP/ccb-desktop-update-runtime" --artifact-cache "$env:RUNNER_TEMP/ccb-desktop-update-artifacts" --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/ccb-desktop-update-runtime/python.exe" -B tools/desktop/update/test_client.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/desktop/update -p test_handoff.py -v

      - name: Upload Desktop test reports
        if: always() && env.CCB_CI_SOURCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-test-reports
          path: |
            ${{ env.CCB_CI_SOURCE }}/app/desktopApp/build/reports/tests/
            ${{ env.CCB_CI_SOURCE }}/app/desktopApp/build/test-results/
            ${{ env.CCB_CI_SOURCE }}/app/desktopApp/build/reports/problems/
