name: PR7 author review fixes
on:
  push:
    branches: [validation/pr7-review-fixes-20261116]
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CHATBAR_VERSION_NAME: 1.4.12-pr7-author-review
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 46cc17fe9450a61592e85a2f734c4e5e59930b7d
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Record exact source and isolated application
        shell: python
        run: |
          import pathlib,subprocess,json,hashlib
          root=pathlib.Path.cwd();out=root/'pr7-review';out.mkdir()
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source=='46cc17fe9450a61592e85a2f734c4e5e59930b7d'
          (out/'source.json').write_text(json.dumps(dict(source=source,baseline='b7cc9385b021ca54bd283ddff92c06ba556086eb',syntheticOnly=True,realAccountCalls=False)))
          p=root/'app/app/build.gradle.kts';s=p.read_text();assert 'applicationId = "com.example.chatbar"' in s;p.write_text(s.replace('applicationId = "com.example.chatbar"','applicationId = "com.example.chatbar.pr7review.r1"'))
          (out/'isolated-identity.patch').write_bytes(subprocess.check_output(['git','diff']))
          for name in ['ReplyDeletionConfirmationTest.kt','ReplyMediaVersionControlsTest.kt']:
            s=(root/'app/app/src/androidTest/java/com/example/chatbar/ui/chat'/name).read_text()
            assert not any(x in s for x in ['MediaStore','takeScreenshot','capture(','Download/'])
          wrapper=root/'app/gradlew';wrapper.chmod(wrapper.stat().st_mode|0o111)
      - name: Reproduce old restore behavior then validate fixed restore and neighbors
        shell: python
        run: |
          import pathlib,subprocess,json,shutil,hashlib
          from xml.etree import ElementTree as ET
          root=pathlib.Path.cwd();out=root/'pr7-review';base='b7cc9385b021ca54bd283ddff92c06ba556086eb'
          files=['app/app/src/main/java/com/example/chatbar/domain/backup/'+n for n in ['BackupMergeEngine.kt','BackupRetainedMedia.kt']]
          fixed={n:(root/n).read_bytes() for n in files}
          proof={n:dict(fixedSha256=hashlib.sha256(b).hexdigest()) for n,b in fixed.items()}
          try:
            for n in files:
              old=subprocess.check_output(['git','show',base+':'+n]);proof[n]['baselineSha256']=hashlib.sha256(old).hexdigest();(root/n).write_bytes(old)
            (out/'baseline-runtime-overlay.patch').write_bytes(subprocess.check_output(['git','diff']))
            result=subprocess.run(['./gradlew',':app:testDebugUnitTest','--tests','*BackupMergeEngineTest.scopedReplacement*Moment*','--no-daemon','--stacktrace'],cwd=root/'app')
            results=root/'app/app/build/test-results/testDebugUnitTest';shutil.copytree(results,out/'baseline-jvm')
            tree=ET.parse(results/'TEST-com.example.chatbar.domain.backup.BackupMergeEngineTest.xml');cases=list(tree.iter('testcase'))
            failed=[c for c in cases if c.find('failure') is not None]
            (out/'baseline-result.json').write_text(json.dumps(dict(returncode=result.returncode,tests=len(cases),failures=[dict(name=c.get('name'),type=c.find('failure').get('type'),message=c.find('failure').get('message')) for c in failed],runtimeFiles=proof)))
            assert result.returncode!=0 and len(cases)==3 and len(failed)==2
            assert all(c.find('failure').get('type')=='org.junit.ComparisonFailure' for c in failed)
          finally:
            for n,b in fixed.items():
              (root/n).write_bytes(b)
              assert hashlib.sha256((root/n).read_bytes()).hexdigest()==proof[n]['fixedSha256']
          subprocess.run(['./gradlew',':app:testDebugUnitTest','--tests','*BackupMergeEngineTest','--tests','*BackupJsonStreamTest','--tests','*BackupExportSelectionTest','--tests','*MomentImageVersionsTest',':app:compileDebugAndroidTestKotlin',':app:assembleDebug','--no-daemon','--stacktrace'],cwd=root/'app',check=True)
          shutil.copytree(root/'app/app/build/test-results/testDebugUnitTest',out/'fixed-jvm')
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 8 API26 original control assertions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd app && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.chatbar.ui.chat.ReplyDeletionConfirmationTest,com.example.chatbar.ui.chat.ReplyMediaVersionControlsTest --no-daemon --stacktrace
      - name: Retain API26 original results
        if: always()
        shell: python
        run: |
          import pathlib,shutil
          source=pathlib.Path('app/app/build/outputs/androidTest-results')
          if source.exists(): shutil.copytree(source,pathlib.Path('pr7-review/native-api26'))
      - name: Android 11 API30 original control assertions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd app && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.chatbar.ui.chat.ReplyDeletionConfirmationTest,com.example.chatbar.ui.chat.ReplyMediaVersionControlsTest --no-daemon --stacktrace
      - name: Retain API30 original results
        if: always()
        shell: python
        run: |
          import pathlib,shutil
          source=pathlib.Path('app/app/build/outputs/androidTest-results')
          if source.exists(): shutil.copytree(source,pathlib.Path('pr7-review/native-api30'))
      - name: Verify isolated APK signature and identity
        shell: python
        run: |
          import pathlib,os,subprocess,hashlib,json
          apk=pathlib.Path('app/app/build/outputs/apk/debug/app-debug.apk');out=pathlib.Path('pr7-review')
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools';tool=max((p for p in sdk.iterdir() if (p/'apksigner').is_file()),key=lambda p:tuple(int(x) for x in p.name.split('.') if x.isdigit()))
          result=subprocess.check_output([str(tool/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True);(out/'apk-signature.txt').write_text(result)
          result=subprocess.check_output([str(tool/'aapt'),'dump','badging',str(apk)],text=True);assert "name='com.example.chatbar.pr7review.r1'" in result;(out/'apk-badging.txt').write_text(result)
          (out/'apk-identity.json').write_text(json.dumps(dict(bytes=apk.stat().st_size,sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),signatureVerified=True,applicationId='com.example.chatbar.pr7review.r1')))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-author-review-originals
          path: |
            pr7-review/
            app/app/build/outputs/apk/debug/
