name: Device-group final local seal
on:
  push:
    branches: [codex/metadata-repair-final-seal-red-20261120, codex/metadata-repair-final-seal-20261120]
permissions:
  contents: read
jobs:
  windows-final-seal:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise fresh local sealing and retained receipts
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.finalSealInspectsFreshSourceOnceWhenItsCurrentLocalDeliveryAlreadyHasAReceipt"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.committedStorageRevisionAutomaticallyPublishesAndLateShutdownSaveSealsWithoutNetworkOrReload"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.lateFounderMetadataRefusalKeepsTheSameSetupThroughColdResumeAndRealInvitation"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupLocalSourceTest.sourceOnlyShutdownRefusesAuthorizedWorkspaceWalWithoutApplyingOrDiscardingIt"
          --max-workers=1 --no-parallel --no-daemon --stacktrace
      - name: Exercise Desktop close and ownership
        if: always()
        working-directory: app
        run: >-
          .\gradlew.bat :desktopApp:test "-PdesktopTestHeadless=true"
          --tests "com.example.chatbar.desktop.DesktopLanSyncShutdownFlushTest"
          --max-workers=1 --no-parallel --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-local-seal-original
          path: |
            app/sharedCore/build/test-results/test/TEST-*.xml
            app/desktopApp/build/test-results/test/TEST-*.xml
  android-compile:
    if: github.ref_name == 'codex/metadata-repair-final-seal-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the Android preview entry
        working-directory: app
        run: >-
          bash ./gradlew :app:compileLanPreviewKotlin
          -Pkotlin.daemon.jvmargs=-Xmx4g --max-workers=1 --no-parallel --no-daemon --stacktrace
