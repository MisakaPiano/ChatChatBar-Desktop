name: Device-group final local seal
on:
  push:
    branches:
      - codex/metadata-repair-final-seal-red-20261120
      - codex/metadata-repair-final-seal-20261120
      - codex/metadata-repair-native-validation-red-20261120
      - codex/metadata-repair-native-validation-20261120
permissions:
  contents: read
jobs:
  windows-final-seal:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Enable long-path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select a fresh canonical NTFS temporary directory
        id: windows-temp
        shell: pwsh
        run: |
          $folder = Join-Path ($env:SystemDrive + '\') ('ccb' + [Guid]::NewGuid().ToString('N').Substring(0, 8))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($folder)).DriveFormat -ne 'NTFS') { throw 'DESKTOP_TEST_NTFS_REQUIRED' }
          $temp = New-Item -ItemType Directory -Path $folder -ErrorAction Stop
          @("TEMP=$($temp.FullName)", "TMP=$($temp.FullName)") | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Exercise fresh local sealing and retained receipts
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.finalSealInspectsFreshSourceOnceWhenItsCurrentLocalDeliveryAlreadyHasAReceipt"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.committedStorageRevisionAutomaticallyPublishesAndLateShutdownSaveSealsWithoutNetworkOrReload"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.lateFounderMetadataRefusalKeepsTheSameSetupThroughColdResumeAndRealInvitation"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupLocalSourceTest.sourceOnlyShutdownRefusesAuthorizedWorkspaceWalWithoutApplyingOrDiscardingIt"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupSourceReceiptTest"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupNodeTest.coldSourceOnlyRetriesWithOrWithoutMetadataPrefetchReuseTheOriginalLocalReceiptWithoutNativeOrLiveRouteWork"
          --tests "com.example.chatbar.domain.lanSync.LanSyncGroupSourceWriterTest.epochRotationRewrapsFromRetainedCiphertextWithoutResigningOrReusingOldDeliveryIds"
          --max-workers=1 --no-parallel --no-daemon --stacktrace
      - name: Exercise Desktop close and ownership
        if: "!cancelled() && steps.windows-temp.outcome == 'success'"
        working-directory: app
        run: >-
          .\gradlew.bat :desktopApp:test "-PdesktopTestHeadless=true"
          --tests "com.example.chatbar.desktop.DesktopLanSyncShutdownFlushTest"
          --max-workers=1 --no-parallel --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-local-seal-original
          path: |
            app/sharedCore/build/test-results/test/TEST-*.xml
            app/desktopApp/build/test-results/test/TEST-*.xml
      - name: Verify the existing 24 MiB conversation with a 256 MiB worker
        if: github.ref_name == 'codex/metadata-repair-native-validation-20261120'
        shell: pwsh
        working-directory: app
        run: |
          $init = Join-Path $env:RUNNER_TEMP 'final-seal-metadata-scale.gradle'
          @'
          import org.gradle.api.tasks.testing.Test
          gradle.projectsEvaluated {
              gradle.rootProject.project(':sharedCore').tasks.named('test', Test).configure {
                  minHeapSize = '64m'
                  maxHeapSize = '256m'
                  maxParallelForks = 1
                  systemProperty 'ccb.lan.metadata.scale', 'unicode24MiB'
              }
          }
          '@ | Set-Content -LiteralPath $init -Encoding utf8
          .\gradlew.bat -I $init :sharedCore:test --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState' --max-workers=1 --no-parallel --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -Raw -LiteralPath 'sharedCore/build/test-results/test/TEST-com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.xml'
          if ($result -notmatch 'SYNTHETIC_METADATA_SCALE_V1 mode=unicode24MiB') { throw 'EXACT_SCALE_MARKER_MISSING' }
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == 'codex/metadata-repair-native-validation-20261120'
        with:
          name: final-local-seal-large-conversation-original
          path: app/sharedCore/build/test-results/test/TEST-com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.xml
  android-compile:
    if: github.ref_name == 'codex/metadata-repair-final-seal-20261120' || github.ref_name == 'codex/metadata-repair-native-validation-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the Android preview entry
        working-directory: app
        run: >-
          bash ./gradlew :app:compileLanPreviewKotlin
          -Pkotlin.daemon.jvmargs=-Xmx4g --max-workers=1 --no-parallel --no-daemon --stacktrace
