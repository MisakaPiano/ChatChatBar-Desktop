name: V7 invitation fifth repair checks
on:
  push:
    branches: [codex/v7-invitation-r04-repair-20261123]
permissions:
  contents: read
jobs:
  missing-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify that a missing owned photo does not block independent conversations
        working-directory: app
        run: |
          bash ./gradlew :sharedCore:test \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupNodeTest.aMissingOwnedMessagePhotoHoldsOnlyItsRealMediaComponentAcrossSignedUpdatesAndColdReopen' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.initialFounderWithMissingOwnedMessageImageCanPublishAnIndependentUnitAndReopen' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncWorkspaceTest.onlyConfirmedOwnedMissingMessageImagesAreIsolated' \
            :desktopApp:compileKotlin :app:compileLanPreviewKotlin \
            -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g \
            --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-r05-missing-image
          path: app/sharedCore/build/test-results/test/TEST-*.xml
