name: V7 invitation fifth repair checks
on:
  push:
    branches: [codex/v7-invitation-r04-repair-20261123]
    paths:
      - app/app/src/androidTest/java/com/example/chatbar/ui/chat/ChatSyncDeletedSessionNativeTest.kt
permissions:
  contents: read
jobs:
  android-deleted-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the isolated Android app and its test companion
        working-directory: app
        run: >-
          bash ./gradlew :app:assembleLanPreview :app:assembleLanPreviewAndroidTest
          -PlanSyncDeviceTests=true -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Enable acceleration on the cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the existing Android chat page after confirmed incoming deletion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1080x1920
            adb install app/app/build/outputs/apk/lanPreview/app-lanPreview.apk
            adb install app/app/build/outputs/apk/androidTest/lanPreview/app-lanPreview-androidTest.apk
            adb shell am instrument -w -e lanSyncDeletedChatFixture true -e class 'com.example.chatbar.ui.chat.ChatSyncDeletedSessionNativeTest#confirmedIncomingDeletionKeepsOpenAndReopenedComposerDraft' com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-r05-android-deleted-chat.txt"
            cat "$RUNNER_TEMP/v7-r05-android-deleted-chat.txt"
            grep -F 'OK (1 test)' "$RUNNER_TEMP/v7-r05-android-deleted-chat.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-r05-android-deleted-chat
          path: ${{ runner.temp }}/v7-r05-android-deleted-chat.txt
