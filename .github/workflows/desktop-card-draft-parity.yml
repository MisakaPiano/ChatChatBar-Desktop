name: Desktop character draft save parity
on:
  push:
    branches: [codex/desktop-card-draft-parity-20261119, codex/desktop-draft-review-proof-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-card-draft-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind canonical synthetic temporary directory and source proof
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ccb-character-draft-parity'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Add-Type 'using System.Text; using System.Runtime.InteropServices; public static class CardDraftFixturePath { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetLongPathName(string path, StringBuilder result, uint size); }'
          $buffer = New-Object System.Text.StringBuilder 32768
          if ([CardDraftFixturePath]::GetLongPathName($folder, $buffer, 32768) -eq 0) { throw 'FIXTURE_NATIVE_PATH_UNCONFIRMED' }
          "TEMP=$buffer" >> $env:GITHUB_ENV
          "TMP=$buffer" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path 'review-character-draft' | Out-Null
          git rev-parse HEAD | Set-Content 'review-character-draft/source.txt'
      - name: Reproduce accepted attachment loss on the prior product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '52aa19d462fa96fdcdd3fc923212589d7b0948fa'
          $file = 'app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopCharacterEditorController.kt'
          git fetch origin $base --depth=1
          git restore --source=$base --worktree -- $file
          $base | Set-Content 'review-character-draft/negative-product-source.txt'
          try {
            Push-Location app
            try {
              .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopCharacterDraftSaveParityTest.clean draft deletion cannot erase attachments accepted while its old directory is being retired' -PdesktopTestHeadless=true --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            if ($negativeExit -ne 1) { throw 'PRIOR_PRODUCT_NEGATIVE_EXIT_NOT_CONFIRMED' }
            $xmlPath = 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopCharacterDraftSaveParityTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $xmlPath
            if ($report.testsuite.tests -ne '1' -or $report.testsuite.failures -ne '1' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'PRIOR_PRODUCT_ATTACHMENT_ASSERTION_FAILURE_NOT_CONFIRMED' }
            if (@($report.testsuite.testcase.failure | Where-Object type -NotMatch 'Assertion').Count -ne 0) { throw 'PRIOR_PRODUCT_FAILURE_NOT_ASSERTION' }
            Copy-Item -LiteralPath $xmlPath -Destination 'review-character-draft/negative-resource-lifetime.xml'
          } finally {
            git restore --source=HEAD --worktree -- $file
            git diff --exit-code -- $file
            if ($LASTEXITCODE -ne 0) { throw 'POSITIVE_PRODUCT_NOT_RESTORED' }
          }
      - name: Verify actual character editor draft lifecycle
        working-directory: app
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopCharacterDraftSaveParityTest'
          --tests 'com.example.chatbar.desktop.DesktopCharacterEditorControllerTest'
          --tests 'com.example.chatbar.desktop.DesktopCharacterManualDraftAdmissionTest'
          -PdesktopTestHeadless=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-character-draft-original-results
          path: |
            app/desktopApp/build/test-results/test/
            review-character-draft/
