name: Exact delivered LAN6 to LAN7 PREPARED recovery and independent Program-only upgrade
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths:
      - .github/lan-next-desktop-lan7-prepared-upgrade-request.json
      - .github/workflows/lan-next-desktop-lan7-prepared-upgrade.yml
permissions:
  contents: read
  actions: read
jobs:
  prepared-retained-upgrade:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bind exact 49B7 controller and unchanged native owners
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Get-FileHash -LiteralPath 'tools/lan-next-control/desktop_lan7_prepared_upgrade_control.py' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '5152c8b26a7900aed5a1737085764ee40fbeea2d6e1489920b34c37c788c738b') { throw 'LAN7_PREPARED_CONTROL_BINDING' }
      - name: Authenticate full originals, run ordinary Main and separate DPAPI components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/desktop_lan7_prepared_upgrade_control.py --request .github/lan-next-desktop-lan7-prepared-upgrade-request.json --output desktop-lan7-prepared-upgrade-evidence
          if ($LASTEXITCODE -ne 0) { throw 'LAN7_PREPARED_NATIVE_UPGRADE' }
      - name: Check small JSON output allowlist
        id: small
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/desktop_lan7_prepared_upgrade_control.py --audit-output --request .github/lan-next-desktop-lan7-prepared-upgrade-request.json --output desktop-lan7-prepared-upgrade-evidence
          if ($LASTEXITCODE -ne 0) { throw 'LAN7_PREPARED_SMALL_OUTPUT' }
      - uses: actions/upload-artifact@v4
        if: always() && steps.small.outcome == 'success'
        with:
          name: lan6-lan7-desktop-prepared-upgrade-small
          if-no-files-found: error
          path: |
            desktop-lan7-prepared-upgrade-evidence/source-request.json
            desktop-lan7-prepared-upgrade-evidence/original-provenance.json
            desktop-lan7-prepared-upgrade-evidence/original-input-bytes.json
            desktop-lan7-prepared-upgrade-evidence/native-lan6-lan7-prepared-upgrade-result.json
            desktop-lan7-prepared-upgrade-evidence/prepared-upgrade-validation.json
            desktop-lan7-prepared-upgrade-evidence/component-seed.json
            desktop-lan7-prepared-upgrade-evidence/component-resume.json
            desktop-lan7-prepared-upgrade-evidence/component-cold_invite.json
            desktop-lan7-prepared-upgrade-evidence/component-archive.json
            desktop-lan7-prepared-upgrade-evidence/component-archive_cold.json
