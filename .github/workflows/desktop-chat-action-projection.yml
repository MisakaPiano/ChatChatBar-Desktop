name: Desktop direct chat action projection
on:
  push:
    branches: [codex/desktop-chat-action-projection-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind canonical temporary directory
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ccb-action-fixtures'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Add-Type 'using System.Text; using System.Runtime.InteropServices; public static class ActionFixturePath { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetLongPathName(string path, StringBuilder result, uint size); }'
          $buffer = New-Object System.Text.StringBuilder 32768
          if ([ActionFixturePath]::GetLongPathName($folder, $buffer, 32768) -eq 0) { throw 'FIXTURE_NATIVE_PATH_UNCONFIRMED' }
          "TEMP=$buffer" >> $env:GITHUB_ENV
          "TMP=$buffer" >> $env:GITHUB_ENV
      - name: Verify shared block reference and query-source policies
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests 'com.example.chatbar.domain.chat.RoleplayActionOptionsPolicyTest'
          --tests 'com.example.chatbar.domain.chat.ChatHistoryActionProjectionTest'
          --tests 'com.example.chatbar.data.repository.ChatContextCandidateSnapshotTest'
          --no-daemon --stacktrace
      - name: Verify actual serialized main requests and affected planning paths
        working-directory: app
        env:
          CCB_ACTION_PROJECTION_REVIEW_DIR: ${{ runner.temp }}/ccb-action-wire-review
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopActionOptionsRequestTest'
          --tests 'com.example.chatbar.desktop.DesktopRealChatRuntimeTest'
          --tests 'com.example.chatbar.desktop.DesktopRegenerationTest'
          --tests 'com.example.chatbar.desktop.DesktopFakeChatRuntimeTest'
          -PdesktopTestHeadless=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-chat-action-projection-original-results
          path: |
            app/sharedCore/build/test-results/test/
            app/desktopApp/build/test-results/test/
            ${{ runner.temp }}/ccb-action-wire-review/
