name: Focused Android image description parameter regression
on:
  push:
    branches: ['codex/desktop-ui-probe-*']
permissions:
  contents: read
concurrency:
  group: image-description-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record source and run selected synthetic Android unit cases
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/ccb-image-description"
          printf '{"source":"%s","run":"%s","scope":"synthetic selected unit tests only; no device, installer, user data or provider calls"}\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ccb-image-description/source.json"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain \
            --tests 'com.example.chatbar.domain.chat.ImageDescriptionModelPolicyTest' \
            --tests 'com.example.chatbar.domain.chat.StreamingChatServiceThinkingTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-description-android-r45-reports
          path: |
            app/app/build/test-results/testDebugUnitTest/
            app/app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/ccb-image-description/
          if-no-files-found: error
