name: Verify Windows updater argv fix through actual Kotlin runtime
on:
  push:
    branches: ['codex/desktop-ui-probe-updateargvfix-*']
permissions:
  contents: read
jobs:
  fixed:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Enable long-path checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated updater and fresh test directories
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path 'C:\' ('ccbargvfix-'+[guid]::NewGuid().ToString('N'))
          if(Test-Path -LiteralPath $base){throw 'NEW_BASE_REQUIRED'}
          New-Item -ItemType Directory -Path $base|Out-Null
          New-Item -ItemType Directory -Path (Join-Path $base 'reports')|Out-Null
          New-Item -ItemType Directory -Path (Join-Path $base 'temp')|Out-Null
          "CCB_ARGV_FIX_BASE=$base"|Add-Content $env:GITHUB_ENV -Encoding utf8
          "TEMP=$base\temp"|Add-Content $env:GITHUB_ENV -Encoding utf8
          "TMP=$base\temp"|Add-Content $env:GITHUB_ENV -Encoding utf8
          @{source=(git rev-parse HEAD);kind='cloud-only synthetic update argv correction'}|ConvertTo-Json|Set-Content (Join-Path $base 'reports/source.json') -Encoding utf8
          python -B tools/desktop/update/prepare_runtime.py --destination (Join-Path $base 'runtime') --artifact-cache (Join-Path $base 'artifacts') --download 1>(Join-Path $base 'reports/runtime-stdout.log') 2>(Join-Path $base 'reports/runtime-stderr.log')
          if($LASTEXITCODE -ne 0){throw 'RUNTIME_PREPARE_FAILED'}
      - name: Verify actual Java prepared CLI and retained TUF policy
        shell: pwsh
        run: |
          $python=Join-Path $env:CCB_ARGV_FIX_BASE 'runtime/python.exe'
          & $python -B .github/update-argv-fix/verify-fixed-argv.py 1>(Join-Path $env:CCB_ARGV_FIX_BASE 'reports/helper-stdout.log') 2>(Join-Path $env:CCB_ARGV_FIX_BASE 'reports/helper-stderr.log')
          if($LASTEXITCODE -ne 0){throw 'HELPER_REGRESSION_FAILED'}
      - name: Compile affected Kotlin and exercise actual runtime on fixed public1245 target
        shell: pwsh
        working-directory: app
        run: |
          .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopNetworkProxyTest' --tests 'com.example.chatbar.desktop.DesktopProxyPhysicalRoutingTest' :desktopApp:verifyUpdateRuntimeArgv -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-update-argv-fix-r01-reports
          path: |
            ${{ env.CCB_ARGV_FIX_BASE }}/reports/
            app/desktopApp/build/test-results/test/
          if-no-files-found: error
