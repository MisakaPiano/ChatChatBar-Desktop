name: Experimental Android facade affected checks
on:
  push:
    branches: ['codex/desktop-ui-probe-*']
permissions:
  contents: read
concurrency:
  group: desktop-ui-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture exact source and run only affected facade regressions
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/ccb-android-experimental"
          printf '{"source":"%s","run":"%s","scope":"synthetic affected facade tests only"}\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ccb-android-experimental/source.json"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain \
            --tests 'com.example.chatbar.domain.chat.StreamingChatServiceThinkingTest' \
            --tests 'com.example.chatbar.domain.chat.StreamingChatServiceTerminalTest' \
            --tests 'com.example.chatbar.domain.chat.StreamingChatServiceStreamTextTest' \
            --tests 'com.example.chatbar.domain.chat.AutomaticChatImagePolicyTest'
      - name: Preserve exact original reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-android-affected-reports
          path: |
            app/app/build/test-results/testDebugUnitTest/
            app/app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/ccb-android-experimental/
          if-no-files-found: error
