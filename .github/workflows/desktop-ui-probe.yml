name: Focused Desktop UI and diagnostic regression

on:
  push:
    branches: ['codex/desktop-ui-probe-*']

permissions:
  contents: read

concurrency:
  group: desktop-ui-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Enable long-path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select a fresh canonical NTFS temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path ($env:SystemDrive + '\') ('p' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($probeRoot)).DriveFormat -ne 'NTFS') { throw 'DESKTOP_TEST_NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          $testTemp = New-Item -ItemType Directory -Path (Join-Path $probeRoot 'temp') -ErrorAction Stop
          @("TEMP=$($testTemp.FullName)", "TMP=$($testTemp.FullName)") | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Record exact source and run bounded synthetic regressions
        shell: pwsh
        working-directory: app
        env:
          CCB_SCREENSHOT_PAGING_REVIEW_DIR: ${{ runner.temp }}/ccb-ui-probe/paging
          CCB_SCREENSHOT_REVIEW_DIR: ${{ runner.temp }}/ccb-ui-probe/export
          CCB_FORMAT_AI_REVIEW_DIR: ${{ runner.temp }}/ccb-ui-probe/style
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/ccb-ui-probe" -Force | Out-Null
          @{ source = (git rev-parse HEAD); run = $env:GITHUB_RUN_ID; scope = 'synthetic selected tests only; no installer, user profile, release or provider calls' } |
            ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ccb-ui-probe/source.json"
          .\gradlew.bat :sharedCore:test -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain `
            --tests 'com.example.chatbar.domain.chat.NarrativeModePersistenceTest' `
            --tests 'com.example.chatbar.domain.chat.MessageAlternativeVersionPolicyTest' `
            --tests 'com.example.chatbar.domain.chat.SessionCopyPolicyTest' `
            --tests 'com.example.chatbar.domain.chat.SaveSlotSerializationTest' `
            --tests 'com.example.chatbar.data.repository.ChatRepositoryConditionalUpdateTest' `
            --tests 'com.example.chatbar.data.repository.ChatRepositoryFoundationTest' `
            --tests 'com.example.chatbar.domain.chat.NarrativeModeRequestAssemblyTest' `
            --tests 'com.example.chatbar.domain.chat.MainChatRequestAssemblerTest' `
            --tests 'com.example.chatbar.domain.chat.ChatHistoryPromptPolicyTest' `
            --tests 'com.example.chatbar.domain.chat.PromptAssemblerCharacterModeTest' `
            --tests 'com.example.chatbar.domain.chat.ExperimentalToolProtocolTest' `
            --tests 'com.example.chatbar.domain.chat.ExperimentalToolTransportTest' `
            --tests 'com.example.chatbar.domain.chat.SiliconFlowChatTemplatePolicyTest' `
            --tests 'com.example.chatbar.domain.chat.OpenAiStreamingTransportTest' `
            --tests 'com.example.chatbar.domain.chat.SelectedAuxiliaryModelParametersTransportTest' `
            --tests 'com.example.chatbar.domain.chat.FormatRepairAuxiliaryTransportTest' `
            --tests 'com.example.chatbar.domain.chat.ModelConnectionProbeTest'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain `
            --tests 'com.example.chatbar.desktop.DesktopNarrativeModeConcurrencyTest' `
            --tests 'com.example.chatbar.desktop.DesktopRegenerationTest' `
            --tests 'com.example.chatbar.desktop.DesktopFishGenerationTest' `
            --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest' `
            --tests 'com.example.chatbar.desktop.DesktopFullBackupServiceTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopOfficial149BackupTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopOfficial148BackupTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopFullBackupSourceTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopFullBackupWriterTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopBackupSelectionTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopMergeRootPreparationTest' `
            --tests 'com.example.chatbar.desktop.backup.DesktopMergeGraphRemapperTest' `
            --tests 'com.example.chatbar.desktop.DesktopFakeChatRuntimeTest' `
            --tests 'com.example.chatbar.desktop.DesktopPromptInspectorTest' `
            --tests 'com.example.chatbar.desktop.DesktopPrimaryChatControllerTest.mode choice*' `
            --tests 'com.example.chatbar.desktop.DesktopPrimaryChatPresentationTest' `
            --tests 'com.example.chatbar.desktop.DesktopModelSettingsControllerTest' `
            --tests 'com.example.chatbar.desktop.DesktopDesignParityTest' `
            --tests 'com.example.chatbar.desktop.DesktopImageClosureR1DesignTest' `
            --tests 'com.example.chatbar.desktop.DesktopMemorySelectedModelParametersTest' `
            --tests 'com.example.chatbar.desktop.DesktopConnectionTestControllerTest' `
            --tests 'com.example.chatbar.desktop.DesktopMessageFormatRepairTest' `
            --tests 'com.example.chatbar.desktop.DesktopNovelAiInfrastructureTest' `
            --tests 'com.example.chatbar.desktop.DesktopAuxiliaryUsageTest' `
            --tests 'com.example.chatbar.desktop.DesktopVoiceAuxiliaryUsageTest'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve actual reports and synthetic review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-probe-reports
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
            app/desktopApp/build/test-results/test/
            app/desktopApp/build/reports/tests/test/
            ${{ runner.temp }}/ccb-ui-probe/
          if-no-files-found: error
