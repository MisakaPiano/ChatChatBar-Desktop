name: Android r2 native UI screenshot evidence
on:
  push:
    branches: [validation/android-r2-capture-20261118]
concurrency:
  group: android-r2-capture
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHATBAR_VERSION_NAME: 1.4.12-next-review-r2
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/android_r2_capture.py /tmp/android_r2_capture.py
      - uses: actions/checkout@v4
        with:
          ref: 9a796f321c748a943e0b0ed0eda1f024a74593da
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/android_r2_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-r2-native-ui-capture
          path: |
            android-r2-capture/
            app/app/build/outputs/androidTest-results/
          retention-days: 14
