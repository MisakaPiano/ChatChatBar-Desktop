name: Desktop source repair and unrelated media concurrency
on:
  push:
    branches: [codex/desktop-message-source-concurrency-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind native canonical temporary directory for synthetic repositories
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ccb-repair-media-fixtures'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Add-Type 'using System.Text; using System.Runtime.InteropServices; public static class RepairMediaPath { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetLongPathName(string path, StringBuilder result, uint size); }'
          $buffer = New-Object System.Text.StringBuilder 32768
          if ([RepairMediaPath]::GetLongPathName($folder, $buffer, 32768) -eq 0) { throw 'FIXTURE_NATIVE_PATH_UNCONFIRMED' }
          "TEMP=$buffer" >> $env:GITHUB_ENV
          "TMP=$buffer" >> $env:GITHUB_ENV
      - name: Verify actual source owners and affected media runtime
        working-directory: app
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopRepairMediaConcurrencyTest'
          --tests 'com.example.chatbar.desktop.DesktopFishGenerationTest'
          --tests 'com.example.chatbar.desktop.DesktopChatVoiceRuntimeTest'
          --tests 'com.example.chatbar.desktop.DesktopVoiceMutationAdmissionTest'
          --tests 'com.example.chatbar.desktop.DesktopAudioMaintenanceTest'
          --tests 'com.example.chatbar.desktop.DesktopVoiceClickReliabilityTest'
          --tests 'com.example.chatbar.desktop.DesktopTaskRuntimeTest'
          --tests 'com.example.chatbar.desktop.DesktopAutomaticFormatRepairTest'
          --tests 'com.example.chatbar.desktop.DesktopPhase7R2R1Test'
          -PdesktopTestHeadless=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-repair-media-concurrency-original-results
          path: |
            app/desktopApp/build/test-results/test/
