name: Bounded device-group metadata regressions
on:
  push:
    branches: [codex/lan-sync-metadata-enrollment-20261120]
permissions:
  contents: read
jobs:
  metadata-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute exact synthetic metadata and founder lifecycle contracts
        working-directory: app
        run: >-
          bash ./gradlew :sharedCore:test
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.aggregateInlineMetadataAboveWorkingWindowActivatesEveryRecordAndColdReopensTheSameGroup'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.singleRecordWorkingBudgetFailureRetainsPreparedIdentityAndColdRetryNeverResetsItsOrigins'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncWorkspaceTest.aggregateMetadataKeepsEveryBodyAndEnforcesIndependentRecordAndIndexLimits'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupUnitCodecTest.actualCardUnitAndDeclaredImageDecryptValidateApplyAndReopenWithExactBusinessAndResourceHashes'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupUnitCodecTest.wrongUnitOrValueHashAndMetadataWorkingBudgetNeverGainUnitAuthority'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.reopeningAPausedLiveFounderDraftPreservesItsSaveCodeFormButNeverResurrectsALockedCode'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.lateFounderMetadataRefusalKeepsTheSameSetupThroughColdResumeAndRealInvitation'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncMetadataBudgetTest.overBudgetEncodedSnapshotCannotReplaceRetainedMetadataOrPublishANewFile'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncAppliedSourceFilesTest.anAuthorizedJournalAboveTheEntityWindowRecoversAndProvesEveryExactPostApplyFile'
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCloudAutomaticReceptionTest.coldConfiguredReceiverAutomaticallyAppliesNewConversationFromHttpsAfterSenderGoesOffline'
          --rerun-tasks --no-build-cache --continue --no-daemon --stacktrace
      - name: Preserve exact class original methods and counts
        if: always()
        env:
          CHECKED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = 'com.example.chatbar.domain.lanSync.'
          scope = {
              'LanSyncGroupEnrollmentTest': {
                  'aggregateInlineMetadataAboveWorkingWindowActivatesEveryRecordAndColdReopensTheSameGroup',
                  'singleRecordWorkingBudgetFailureRetainsPreparedIdentityAndColdRetryNeverResetsItsOrigins',
                  'oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState',
              },
              'LanSyncWorkspaceTest': {'aggregateMetadataKeepsEveryBodyAndEnforcesIndependentRecordAndIndexLimits'},
              'LanSyncGroupUnitCodecTest': {
                  'actualCardUnitAndDeclaredImageDecryptValidateApplyAndReopenWithExactBusinessAndResourceHashes',
                  'wrongUnitOrValueHashAndMetadataWorkingBudgetNeverGainUnitAuthority',
              },
              'LanSyncGroupCoordinatorTest': {
                  'reopeningAPausedLiveFounderDraftPreservesItsSaveCodeFormButNeverResurrectsALockedCode',
                  'lateFounderMetadataRefusalKeepsTheSameSetupThroughColdResumeAndRealInvitation',
              },
              'LanSyncMetadataBudgetTest': {'overBudgetEncodedSnapshotCannotReplaceRetainedMetadataOrPublishANewFile'},
              'LanSyncAppliedSourceFilesTest': {'anAuthorizedJournalAboveTheEntityWindowRecoversAndProvesEveryExactPostApplyFile'},
              'LanSyncGroupCloudAutomaticReceptionTest': {'coldConfiguredReceiverAutomaticallyAppliesNewConversationFromHttpsAfterSenderGoesOffline'},
          }
          directory = Path('app/sharedCore/build/test-results/test')
          result = {'head': os.environ['CHECKED_HEAD'], 'classes': [], 'problems': [],
                    'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          expected_xml = {'TEST-' + base + short + '.xml' for short in scope}
          if {item.name for item in directory.glob('TEST-*.xml')} != expected_xml:
              result['problems'].append('UNEXPECTED_XML_INVENTORY')
          for short, expected in scope.items():
              name = base + short
              case_result = {'class': name, 'expectedMethods': sorted(expected), 'problems': []}
              result['classes'].append(case_result)
              path = directory / ('TEST-' + name + '.xml')
              problems = case_result['problems']
              if not path.is_file():
                  problems.append('MISSING_CLASS')
                  continue
              raw = path.read_bytes()
              if b'\x00' in raw or b'<!DOCTYPE' in raw.upper() or b'<!ENTITY' in raw.upper():
                  problems.append('FORBIDDEN_XML_DECLARATION')
              else:
                  suite = ET.fromstring(raw)
                  nodes = list(suite.iter())
                  local = lambda node: node.tag.rsplit('}', 1)[-1] if isinstance(node.tag, str) else ''
                  cases = suite.findall('testcase')
                  all_cases = [node for node in nodes if local(node) == 'testcase']
                  counts = {'tests': len(all_cases)}
                  counts.update({key: sum(local(node) == tag for node in nodes)
                                 for key, tag in [('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped')]})
                  case_result.update(counts)
                  for key, count in counts.items():
                      result[key] += count
                  case_result['actualMethods'] = [case.get('name') for case in all_cases]
                  if suite.tag != 'testsuite' or suite.get('name') != name:
                      problems.append('ROOT_SUITE_MISMATCH')
                  if any(key not in suite.attrib for key in counts):
                      problems.append('MISSING_COUNT_DECLARATION')
                  if any(int(suite.get(key, '0')) != value for key, value in counts.items()):
                      problems.append('COUNT_MISMATCH')
                  if len(cases) != len(expected) or all_cases != cases or {case.get('name') for case in cases} != expected or any(case.get('classname') != name for case in cases):
                      problems.append('EXACT_METHODS_NOT_EXECUTED')
                  if counts != {'tests': len(expected), 'failures': 0, 'errors': 0, 'skipped': 0}:
                      problems.append('METHODS_NOT_PASS')
          if any(case['problems'] for case in result['classes']):
              result['problems'].append('SCOPED_CASES_NOT_ALL_PASS')
          output = Path('app/build/reports/metadata-enrollment-regression.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result))
          if result['problems']:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-enrollment-regression-original-results
          path: |
            app/sharedCore/build/test-results/test/
            app/build/reports/metadata-enrollment-regression.json
      - name: Compile both changed platform entries
        if: always()
        working-directory: app
        run: bash ./gradlew :app:compileLanPreviewKotlin :desktopApp:compileKotlin --continue --no-daemon --stacktrace
  metadata-text-scale:
    needs: metadata-enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute exact text-scale test with a 256 MiB worker heap
        working-directory: app
        run: |
          cat > "$RUNNER_TEMP/metadata-text-scale.gradle" <<'GROOVY'
          import org.gradle.api.tasks.testing.Test
          gradle.projectsEvaluated {
              gradle.rootProject.project(':sharedCore').tasks.named('test', Test).configure {
                  minHeapSize = '64m'
                  maxHeapSize = '256m'
                  maxParallelForks = 1
                  systemProperty 'ccb.lan.metadata.scale', 'unicode24MiB'
              }
          }
          GROOVY
          bash ./gradlew -I "$RUNNER_TEMP/metadata-text-scale.gradle" :sharedCore:test \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState' \
            --rerun-tasks --no-build-cache --no-daemon --stacktrace
      - name: Verify the original scaled case and measurement
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cls = 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest'
          method = 'oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState'
          directory = Path('app/sharedCore/build/test-results/test')
          path = directory / ('TEST-' + cls + '.xml')
          assert set(directory.glob('TEST-*.xml')) == {path}
          raw = path.read_bytes()
          assert not any(token in raw.upper() for token in (b'\x00', b'<!DOCTYPE', b'<!ENTITY'))
          suite = ET.fromstring(raw)
          assert suite.tag == 'testsuite' and suite.get('name') == cls
          assert [suite.get(key) for key in ('tests', 'failures', 'errors', 'skipped')] == ['1', '0', '0', '0']
          cases = list(suite.iter('testcase'))
          assert len(cases) == 1 and cases[0].get('name') == method and cases[0].get('classname') == cls
          assert not any(node.tag in ('failure', 'error', 'skipped') for node in suite.iter())
          markers = [line for node in suite.findall('system-out') for line in (node.text or '').splitlines()
                     if line.startswith('SYNTHETIC_METADATA_SCALE_V1 ')]
          assert len(markers) == 1 and ' mode=unicode24MiB ' in markers[0]
          print(markers[0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-text-scale-original-result
          path: app/sharedCore/build/test-results/test/TEST-com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.xml
