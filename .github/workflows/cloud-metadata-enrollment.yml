name: Device-group HTTPS observation and bounded text scale
on:
  push:
    branches: [codex/metadata-repair-auth-observation-20261120]
permissions:
  contents: read
jobs:
  metadata-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute the authenticated cold HTTPS receiver
        working-directory: app
        run: >-
          bash ./gradlew :sharedCore:test
          --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCloudAutomaticReceptionTest.coldConfiguredReceiverAutomaticallyAppliesNewConversationFromHttpsAfterSenderGoesOffline'
          --rerun-tasks --no-build-cache --no-daemon --stacktrace
      - name: Check the exact original case and actual HTTPS counters
        env:
          CHECKED_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cls = 'com.example.chatbar.domain.lanSync.LanSyncGroupCloudAutomaticReceptionTest'
          method = 'coldConfiguredReceiverAutomaticallyAppliesNewConversationFromHttpsAfterSenderGoesOffline'
          directory = Path('app/sharedCore/build/test-results/test')
          original = directory / ('TEST-' + cls + '.xml')
          assert set(directory.glob('TEST-*.xml')) == {original}
          suite = ET.fromstring(original.read_bytes())
          assert suite.tag == 'testsuite' and suite.get('name') == cls
          assert all(suite.get(key) == count for key, count in
                     {'tests': '1', 'failures': '0', 'errors': '0', 'skipped': '0'}.items())
          cases = suite.findall('testcase')
          assert len(cases) == 1 and not list(cases[0])
          assert cases[0].get('classname') == cls and cases[0].get('name') == method
          prefix = 'CCB_GROUP_CLOUD_AUTOMATIC_RECEPTION '
          lines = (suite.findtext('system-out') or '').splitlines()
          matches = [json.loads(line[len(prefix):]) for line in lines if line.startswith(prefix)]
          assert len(matches) == 1
          observation = matches[0]
          assert observation['authenticatedHttpsRequests'] > 0 and observation['incompleteHttpsRequests'] >= 0
          assert observation['plainHttpRequests'] == observation['lanConnectAttempts'] == 0
          assert observation['senderOfflineRootMoved'] and observation['receiverAuthorUnchanged']
          proof = {'head': os.environ['CHECKED_HEAD'], 'case': cls + '.' + method, 'observation': observation}
          (directory / 'exact-https-auth-observation.json').write_text(json.dumps(proof) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: https-auth-observation-original
          path: app/sharedCore/build/test-results/test/
  metadata-text-scale:
    needs: metadata-enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute exact text-scale test with a 256 MiB worker heap
        working-directory: app
        run: |
          cat > "$RUNNER_TEMP/metadata-text-scale.gradle" <<'GROOVY'
          import org.gradle.api.tasks.testing.Test
          gradle.projectsEvaluated {
              gradle.rootProject.project(':sharedCore').tasks.named('test', Test).configure {
                  minHeapSize = '64m'
                  maxHeapSize = '256m'
                  maxParallelForks = 1
                  systemProperty 'ccb.lan.metadata.scale', 'unicode24MiB'
              }
          }
          GROOVY
          bash ./gradlew -I "$RUNNER_TEMP/metadata-text-scale.gradle" :sharedCore:test \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState' \
            --rerun-tasks --no-build-cache --no-daemon --stacktrace
      - name: Verify the original scaled case and measurement
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cls = 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest'
          method = 'oneConversationAboveTheRecordWindowPreservesExactSourceUnitCheckpointAndColdNativeState'
          directory = Path('app/sharedCore/build/test-results/test')
          path = directory / ('TEST-' + cls + '.xml')
          assert set(directory.glob('TEST-*.xml')) == {path}
          raw = path.read_bytes()
          assert not any(token in raw.upper() for token in (b'\x00', b'<!DOCTYPE', b'<!ENTITY'))
          suite = ET.fromstring(raw)
          assert suite.tag == 'testsuite' and suite.get('name') == cls
          assert [suite.get(key) for key in ('tests', 'failures', 'errors', 'skipped')] == ['1', '0', '0', '0']
          cases = list(suite.iter('testcase'))
          assert len(cases) == 1 and cases[0].get('name') == method and cases[0].get('classname') == cls
          assert not any(node.tag in ('failure', 'error', 'skipped') for node in suite.iter())
          markers = [line for node in suite.findall('system-out') for line in (node.text or '').splitlines()
                     if line.startswith('SYNTHETIC_METADATA_SCALE_V1 ')]
          assert len(markers) == 1 and ' mode=unicode24MiB ' in markers[0]
          print(markers[0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-text-scale-original-result
          path: app/sharedCore/build/test-results/test/TEST-com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest.xml
