name: Explicit exact delivered lan5 to lan6 Desktop profile upgrade
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths: [.github/lan-next-sync-desktop-lan6-upgrade-request.json]
permissions:
  contents: read
  actions: read
jobs:
  original-program-swap:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Download and authenticate both exact original package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/desktop_lan6_control.py fetch-originals --request .github/lan-next-sync-desktop-lan6-upgrade-request.json --output desktop-lan5-lan6-upgrade-evidence
          if ($LASTEXITCODE -ne 0) { throw 'LAN5_LAN6_ORIGINAL_PROVENANCE_OR_BYTES' }
      - name: Five actual native launches with Program-only replacement
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/prove_desktop_lan5_lan6.py --request .github/lan-next-sync-desktop-lan6-upgrade-request.json --output desktop-lan5-lan6-upgrade-evidence
          if ($LASTEXITCODE -ne 0) { throw 'LAN5_LAN6_NATIVE_PROFILE_UPGRADE' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lan5-lan6-desktop-profile-upgrade-evidence
          if-no-files-found: error
          path: desktop-lan5-lan6-upgrade-evidence/*.json
