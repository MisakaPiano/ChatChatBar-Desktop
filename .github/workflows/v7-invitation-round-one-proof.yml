name: V7 invitation first repair checks
on:
  push:
    branches: [codex/v7-invitation-r01-repair-20261123]
permissions:
  contents: read
jobs:
  invitation:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify invitation proof, archive, and desktop rendering
        working-directory: app
        run: |
          bash ./gradlew :sharedCore:test \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.issuedInviteCanReachApprovalAfterDesktopFocusLocksManagement' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.cancellingAfterProofRejectsTheStaleApprovalWithoutWritingNamesOrMembership' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.cancellingDuringReplacementDoesNotIssueTheQueuedInvitation' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.cancellationAfterRootIntentDoesNotReportSuccessOrLoseTheApprovedMember' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupInvitationTest' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupJoiningTest' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupAppTransportTest' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupEnrollmentTest' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupPeerNamesTest' \
            --tests 'com.example.chatbar.domain.syncStore.SyncGroupInboxTest' \
            :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopLanSyncGroupInvitationQrTest' \
            --tests 'com.example.chatbar.desktop.DesktopLanSyncResourceTest.phoneBmpSessionBackgroundRetainsOriginalBytesAndPreviewsAfterColdApply' \
            --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Require the key regression cases in the original JUnit reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          expected_cases = (
              ('desktopApp', 'com.example.chatbar.desktop.DesktopLanSyncResourceTest',
               'phoneBmpSessionBackgroundRetainsOriginalBytesAndPreviewsAfterColdApply'),
              ('sharedCore', 'com.example.chatbar.domain.lanSync.LanSyncGroupJoiningTest',
               'legacyAttemptWithLocallyRetainedSignedApprovalCannotBeShelvedWhileOffline'),
              ('sharedCore', 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest',
               'cancellingDuringReplacementDoesNotIssueTheQueuedInvitation'),
          )
          for module, suite, expected in expected_cases:
              report = Path(f'app/{module}/build/test-results/test/TEST-{suite}.xml')
              cases = [case for case in ElementTree.parse(report).getroot().findall('testcase') if case.get('name') == expected]
              assert len(cases) == 1 and not list(cases[0]), f'{expected} did not report success'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-invitation-r01-original
          path: |
            app/sharedCore/build/test-results/test/TEST-*.xml
            app/desktopApp/build/test-results/test/TEST-*.xml
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated Android 87 and its synthetic test companion
        working-directory: app
        run: >-
          bash ./gradlew :app:assembleLanPreview :app:assembleLanPreviewAndroidTest
          -PlanSyncDeviceTests=true -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Enable acceleration on the cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the Android bitmap path on an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install app/app/build/outputs/apk/lanPreview/app-lanPreview.apk
            adb install app/app/build/outputs/apk/androidTest/lanPreview/app-lanPreview-androidTest.apk
            adb shell am instrument -w -e class com.example.chatbar.lanSync.AndroidLanSyncBmpResourceTest com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-android-bmp.txt"
            cat "$RUNNER_TEMP/v7-android-bmp.txt"
            grep -F 'OK (1 test)' "$RUNNER_TEMP/v7-android-bmp.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-invitation-r01-android-bmp
          path: ${{ runner.temp }}/v7-android-bmp.txt
