name: Android consolidated acceptance r2
on:
  push:
    branches: [validation/android-review-r2-20261118]
concurrency:
  group: android-review-r2
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CHATBAR_VERSION_NAME: 1.4.12-next-review-r2
      VERSION_REVIEW_FIXTURE_DIR: ${{ github.workspace }}/android-review-r2/fixtures
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp validation/android_review_r2.py /tmp/android_review_r2.py
          cp validation/android_r2_native_classes.txt /tmp/android_r2_native_classes.txt
      - uses: actions/checkout@v4
        with:
          ref: 9a796f321c748a943e0b0ed0eda1f024a74593da
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python /tmp/android_review_r2.py prepare
      - name: Full JVM and standard package compile
        run: python /tmp/android_review_r2.py jvm-standard
      - name: Prepare isolated combined acceptance app
        run: python /tmp/android_review_r2.py prepare-review
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Combined regression API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/android_review_r2.py native-api30
      - name: Combined regression API26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/android_review_r2.py native-api26
      - run: python /tmp/android_review_r2.py package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-review-r2-originals
          path: |
            android-review-r2/
            app/app/build/outputs/androidTest-results/
            app/app/build/reports/androidTests/
            app/app/build/reports/tests/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CCB-consolidated-review-r2-apk
          path: review-apk/CCB-consolidated-review-r2.apk
          retention-days: 14
