name: V7 Windows and Android runner connectivity probe
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths: [.github/workflows/lan-v7-windows-android-probe.yml]
permissions:
  contents: read
jobs:
  same-runner:
    runs-on: windows-latest
    timeout-minutes: 23
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator system-images;android-26;google_apis;x86_64'
      - name: Boot a fresh API26 emulator and probe a private host socket
        timeout-minutes: 16
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows') { throw 'PROBE_WINDOWS_RUNNER_ONLY' }
          $root = Join-Path $env:RUNNER_TEMP ('ccb-v7-probe-' + [guid]::NewGuid().ToString('n'))
          $null = New-Item -ItemType Directory -Path $root
          $env:ANDROID_AVD_HOME = (New-Item -ItemType Directory -Path (Join-Path $root 'avd')).FullName
          $sdk = $env:ANDROID_HOME
          if (!$sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $emulator = Join-Path $sdk 'emulator\emulator.exe'
          $adb = Join-Path $sdk 'platform-tools\adb.exe'
          $env:ANDROID_I_WANT_MY_TCG = 'yes'
          $result = [ordered]@{kind='CCB_V7_HOST_NETWORK_PROBE';booted=$false;accelerated=$false;privateSocket=$false;privateSource=$false;api=$null}
          $vm = $null
          try {
            'no' | avdmanager create avd --name CCBV7Probe --package 'system-images;android-26;google_apis;x86_64'
            if ($LASTEXITCODE) { throw 'PROBE_AVD_CREATION_FAILED' }
            $accel = & $emulator -accel-check 2>&1 | Out-String
            $result.accelerated = ($LASTEXITCODE -eq 0 -and $accel -match 'WHPX.*usable')
            $mode = if ($result.accelerated) { 'on' } else { 'off' }
            $argsForProbe = @('-avd','CCBV7Probe','-port','5554','-no-window','-no-audio','-no-snapshot','-no-boot-anim','-accel',$mode,'-gpu','swiftshader_indirect','-memory','1536','-cores','2')
            $stderr = Join-Path $root 'emulator-stderr.txt'
            $vm = Start-Process -FilePath $emulator -ArgumentList $argsForProbe -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $root 'emulator-stdout.txt') -RedirectStandardError $stderr
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($clock.Elapsed.TotalSeconds -lt 690) {
              $vm.Refresh()
              if ($vm.HasExited) {
                $raw = Get-Content -LiteralPath $stderr -Raw
                $result.emulatorExit = $vm.ExitCode
                $result.accelerationError = [bool]($raw -match 'acceleration|hypervisor|WHPX|TCG')
                $result.graphicsError = [bool]($raw -match 'Vulkan|OpenGLES|ANGLE|graphics')
                throw 'PROBE_EMULATOR_EXITED'
              }
              $boot = & $adb -s emulator-5554 shell getprop sys.boot_completed 2>$null
              if ($LASTEXITCODE -eq 0 -and "$boot".Trim() -eq '1') { $result.booted = $true; break }
              Start-Sleep -Seconds 5
            }
            if (!$result.booted) { throw 'PROBE_EMULATOR_BOOT_EXPIRED' }
            $api = & $adb -s emulator-5554 shell getprop ro.build.version.sdk
            if ($LASTEXITCODE -or "$api".Trim() -ne '26') { throw 'PROBE_ANDROID_API' }
            $result.api = 26
            function Test-RunnerRoute([string]$bind, [string]$target) {
              $server = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Parse($bind), 0)
              $guestProcess = $null; $client = $null
              $resultForRoute = [ordered]@{connected=$false;sourceIsPrivate=$false;sourceIsLoopback=$false;guestExit=$null}
              try {
                $server.Start(1)
                $port = $server.LocalEndpoint.Port
                $waiting = $server.AcceptTcpClientAsync()
                $guestProcess = Start-Process -FilePath $adb -ArgumentList @('-s','emulator-5554','shell',('echo V7 | toybox nc -w 4 {0} {1}' -f $target,$port)) -PassThru -WindowStyle Hidden
                if ($waiting.Wait(8000)) {
                  $client = $waiting.Result
                  $remote = $client.Client.RemoteEndPoint.Address
                  $resultForRoute.connected = $true
                  $resultForRoute.sourceIsLoopback = [Net.IPAddress]::IsLoopback($remote)
                  $resultForRoute.sourceIsPrivate = $remote.ToString() -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)'
                }
                if ($guestProcess.HasExited) { $resultForRoute.guestExit = $guestProcess.ExitCode }
              } finally {
                if ($client) { $client.Dispose() }
                $server.Stop()
                if ($guestProcess -and !$guestProcess.HasExited) { $guestProcess.Kill() }
              }
              return $resultForRoute
            }
            $result.aliasRoute = Test-RunnerRoute '127.0.0.1' '10.0.2.2'
            $preferred = @(Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue | Sort-Object RouteMetric | Select-Object -ExpandProperty InterfaceIndex)
            $addresses = @(Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.AddressState -eq 'Preferred' -and $_.IPAddress -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' } | Sort-Object @{Expression={if ($preferred -contains $_.InterfaceIndex) {0} else {1}}} | Select-Object -ExpandProperty IPAddress -Unique -First 4)
            $result.privateRoutes = @($addresses | ForEach-Object { Test-RunnerRoute $_ $_ })
            $result.privateSocket = @($result.privateRoutes | Where-Object {$_.connected}).Count -gt 0
            $result.privateSource = @($result.privateRoutes | Where-Object {$_.connected -and $_.sourceIsPrivate}).Count -gt 0
            if (!$result.privateSource -and !$result.aliasRoute.connected) { throw 'PROBE_NO_ROUTE_OBSERVED' }
          } finally {
            if ($vm) {
              & $adb -s emulator-5554 emu kill 2>$null | Out-Null
              if (!$vm.WaitForExit(10000)) { $vm.Kill() }
            }
            $result | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'v7-host-network-probe.json') -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-windows-android-runner-probe
          path: ${{ runner.temp }}/v7-host-network-probe.json
          if-no-files-found: ignore
