name: V7 invitation third repair checks
on:
  push:
    branches: [codex/v7-invitation-r03-repair-20261123]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify conversation publication during storage maintenance
        working-directory: app
        run: |
          bash ./gradlew :sharedCore:test \
            --tests 'com.example.chatbar.data.repository.ChatRepositorySyncAdmissionTest' \
            --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-invitation-r03-original
          path: app/sharedCore/build/test-results/test/TEST-*.xml
