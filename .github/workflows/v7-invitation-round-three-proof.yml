name: V7 invitation third repair checks
on:
  push:
    branches: [codex/v7-invitation-r03-repair-20261123]
permissions:
  contents: read
jobs:
  camera-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Encode a synthetic 64 × 48 HEIF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libheif-examples libheif-plugin-x265
          python3 - <<'PY'
          import pathlib
          import struct
          import zlib

          def chunk(kind, content):
              return struct.pack('>I', len(content)) + kind + content + struct.pack('>I', zlib.crc32(kind + content))

          header = struct.pack('>IIBBBBB', 64, 48, 8, 2, 0, 0, 0)
          pixels = (bytes([0]) + bytes([28, 136, 192]) * 64) * 48
          data = bytes.fromhex('89504e470d0a1a0a') + chunk(b'IHDR', header)
          data += chunk(b'IDAT', zlib.compress(pixels)) + chunk(b'IEND', b'')
          pathlib.Path('synthetic.png').write_bytes(data)
          PY
          heif-enc -q 75 -o synthetic.heic synthetic.png 2>encoder.log || { cat encoder.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: v7-r03-synthetic-heif
          path: synthetic.heic
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify conversation publication during storage maintenance
        working-directory: app
        run: |
          bash ./gradlew :sharedCore:test \
            --tests 'com.example.chatbar.data.repository.ChatRepositorySyncAdmissionTest' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupManagementRecoveryTest.founderAndRecoveredManagerInviteFromPublishedHistoryWhileADeviceHasUnconfirmedLocalChanges' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupManagementRecoveryTest.theCurrentSignedCheckpointMustBeServedEvenWhenTheInviterAlreadyHasItInCustody' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.cancellingDuringReplacementDoesNotIssueTheQueuedInvitation' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.fileBindingSurvivesVisibilityLossAndCannotWriteAfterCancellation' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.automaticLocalCheckClearsItsOwnRecoveredMaintenanceNotice' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupCoordinatorTest.activeJoinedDeviceRefreshesItsOwnMemberRowAfterReceivingSignedRevocation' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupJoiningTest.ordinaryMemberCanUseAFileContainingEveryAuthenticatedHeadBeyondV1TextCapacity' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupJoiningTest.revokedJoinWithAdmittedKeysAndMissingInitialDataArchivesWithoutReusingItsRecipient' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupJoiningTest.verifiedRevocationCannotArchiveAnAuthorOriginWrittenBeforeTheNativeStageMarker' \
            --tests 'com.example.chatbar.domain.lanSync.LanSyncGroupJoiningTest.coldSignedLedgerForkKeepsTheSameApplicationForExplicitRecheckWithoutShelving' \
            -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 \
            --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-invitation-r03-original
          path: app/sharedCore/build/test-results/test/TEST-*.xml
  desktop:
    needs: camera-fixture
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: v7-r03-synthetic-heif
          path: ${{ runner.temp }}/r03-raster
      - name: Verify Windows request payloads and invitation file selection
        working-directory: app
        env:
          CCB_R02_HEIF_FIXTURE: ${{ runner.temp }}/r03-raster/synthetic.heic
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopPhase7ImagesTest.highBaselineJpegUsesBoundedWireBytesForContinueRegenerateAndDirectHistory'
          --tests 'com.example.chatbar.desktop.DesktopPhase7ImagesTest.unavailableHeifRequestPreservesOriginalAndAllowsExplicitTextAndCompatibleImage'
          --tests 'com.example.chatbar.desktop.WindowsCommonItemDialogTest'
          -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-invitation-r03-desktop-original
          path: app/desktopApp/build/test-results/test/TEST-*.xml
  android-send:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the isolated Android application and instrumented tests
        working-directory: app
        run: >-
          bash ./gradlew :app:assembleLanPreview :app:assembleLanPreviewAndroidTest
          -PlanSyncDeviceTests=true -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Enable acceleration on the cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify that normal Android sending recovers from maintenance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install app/app/build/outputs/apk/lanPreview/app-lanPreview.apk
            adb install app/app/build/outputs/apk/androidTest/lanPreview/app-lanPreview-androidTest.apk
            adb shell am instrument -w -e lanSyncOrdinarySendFixture true -e class 'com.example.chatbar.ui.chat.ChatOrdinarySendNativeTest#maintenanceRefusalRetainsTheDraftAndOneRetryCommitsExactlyOnce' com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-r03-android-send.txt"
            cat "$RUNNER_TEMP/v7-r03-android-send.txt"
            grep -F 'OK (1 test)' "$RUNNER_TEMP/v7-r03-android-send.txt"
            adb shell am instrument -w -e lanSyncInvitationFileRestoreFixture true -e class 'com.example.chatbar.lanSync.AndroidLanSyncInvitationFileRestorationTest#restoredPickerSavesTheSameInvitationAndARevokedSelectionCannotWrite' com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-r03-android-file.txt"
            cat "$RUNNER_TEMP/v7-r03-android-file.txt"
            grep -F 'OK (1 test)' "$RUNNER_TEMP/v7-r03-android-file.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-invitation-r03-android-send
          path: ${{ runner.temp }}/v7-r03-android-*.txt
