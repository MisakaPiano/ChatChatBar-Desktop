name: V7 invitation sixth repair checks
on:
  push:
    branches: [codex/v7-invitation-r04-repair-20261123]
    paths:
      - app/sharedCore/**
      - app/app/src/main/java/com/example/chatbar/lanSync/**
      - app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/lanSync/**
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify explicit signed recovery and its compatibility boundaries
        working-directory: app
        run: |
          bash ./gradlew :sharedCore:test \
            --tests '*SyncGroupLedgerRecoveryTest' \
            --tests '*SyncLedgerRecoveryFileCodecTest' \
            --tests '*SyncDeviceLedgerTest' \
            --tests '*SyncGroupKeyDeliveryTest' \
            --tests '*LanSyncGroupCoordinatorManagementRecoveryTest.signedMembershipRecoveryRetainsBothBranchesAndRequiresExplicitImportAfterColdOpen' \
            --tests '*LanSyncGroupCoordinatorManagementRecoveryTest.independentManagersRetainBothSignedMembershipBranchesAndCannotResumeOrdinaryWorkAfterColdOpen' \
            --tests '*LanSyncGroupCoordinatorManagementRecoveryTest.recoveredManagerThatSeesFirstApprovalSignsTheNextMemberFromItsNewParent' \
            --tests '*LanSyncGroupCiphertextTransportTest.recoveredAuthorityRejectsLegacyStoreAndLedgerCommandsBeforeOpeningTheBackend' \
            --tests '*LanSyncGroupInvitationTest.onlyRecoveryBootstrapUsesV2AndItsCapabilityCannotBeRelabeledAsV1' \
            --tests '*LanSyncGroupJoiningTest.aRetainedV1InvitationCannotAdmitRecoveredLedgerUntilAnExplicitFreshJoin2' \
            --tests '*LanSyncGroupNearbyStatusTest.mixedSameNameMembersKeepBothObservationsAndColdStartDoesNotInventReachability' \
            --tests '*LanSyncGroupNodeTest.signedConversationDeletionRetriesOnlyRepositoryReloadAcrossColdOpenAndSourceOnlyShutdown' \
            --tests '*LanSyncGroupNodeTest.olderAppliedHistoryWithoutARefreshMarkerSurvivesCancelledReloadAndIgnoresSourceOnlyReceipts' \
            --tests '*LanSyncGroupNativePlannerTest.priorRecoveryHeldReceiptPreservesItsLinkedChatAndAllowsAnIndependentIncomingUnit' \
            --tests '*LanSyncGroupNativeApplyOwnerTest.aLostControlReceiptAfterNativeApplyAdvancesExactUnitsWithoutOverwritingLaterLocalEdits' \
            -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g \
            --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-r06-membership-and-nearby
          path: app/sharedCore/build/test-results/test/TEST-*.xml
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile both real platform pages
        working-directory: app
        run: >-
          bash ./gradlew :app:compileLanPreviewKotlin :desktopApp:compileKotlin
          -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g
          --no-daemon --max-workers=1 --no-parallel --console=plain
