name: V7 invitation eighth repair checks
on:
  push:
    branches: [codex/v7-invitation-r08-repair-20261123]
    paths:
      - .github/workflows/v7-invitation-round-eight-proof.yml
      - app/sharedCore/**
      - app/app/src/main/java/com/example/chatbar/lanSync/**
      - app/app/src/androidTest/java/com/example/chatbar/lanSync/**
      - app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/lanSync/**
      - app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopChatImages.kt
      - app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopImageEditing.kt
      - app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopImageViewer.kt
      - app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopPrimaryChatController.kt
      - app/desktopApp/src/test/**
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the isolated app and Activity tests
        working-directory: app
        run: >-
          bash ./gradlew :app:assembleLanPreview :app:assembleLanPreviewAndroidTest
          -PlanSyncDeviceTests=true -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Enable acceleration on the cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise compact group controls and file selection lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 320
            adb shell wm size
            adb shell wm density
            adb install app/app/build/outputs/apk/lanPreview/app-lanPreview.apk
            adb install app/app/build/outputs/apk/androidTest/lanPreview/app-lanPreview-androidTest.apk
            adb shell am instrument -w -e lanSyncInvitationQrFixture true -e class com.example.chatbar.lanSync.AndroidLanSyncInvitationQrTest com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-r08-android-viewport.txt"
            cat "$RUNNER_TEMP/v7-r08-android-viewport.txt"
            adb shell am instrument -w -e lanSyncInvitationFileRestoreFixture true -e class com.example.chatbar.lanSync.AndroidLanSyncInvitationFileRestorationTest com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-r08-android-files.txt"
            cat "$RUNNER_TEMP/v7-r08-android-files.txt"
            adb shell am instrument -w -e class 'com.example.chatbar.lanSync.AndroidLanSyncCameraResourceTest#incompleteRecognizedHeifHoldsOnlyItsOwningChat' com.example.chatbar.lansyncnext.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/v7-r08-android-image.txt"
            cat "$RUNNER_TEMP/v7-r08-android-image.txt"
            grep -F 'OK (2 tests)' "$RUNNER_TEMP/v7-r08-android-viewport.txt"
            grep -F 'OK (2 tests)' "$RUNNER_TEMP/v7-r08-android-files.txt"
            grep -F 'OK (1 test)' "$RUNNER_TEMP/v7-r08-android-image.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-r08-android-viewport-and-files
          path: ${{ runner.temp }}/v7-r08-android-*.txt
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check nearby membership continuation and safe invitation archive
        working-directory: app
        run: |
          bash ./gradlew :sharedCore:test \
            --tests '*LanSyncGroupCoordinatorManagementRecoveryTest.membersContinueOverNearbyAfterMissingAnApprovalFromTheSameInstalledRecovery' \
            --tests '*LanSyncGroupCoordinatorManagementRecoveryTest.anotherAdministratorCanProvideSignedRecoveryWhileNativeApplyIsPartiallyWritten' \
            --tests '*LanSyncGroupLedgerCatchUpTest' \
            --tests '*LanSyncGroupCiphertextTransportTest.recoveredAuthorityRejectsLegacyStoreAndLedgerCommandsBeforeOpeningTheBackend' \
            --tests '*LanSyncGroupJoiningTest.revokedJoinWithAdmittedKeysAndMissingInitialDataArchivesWithoutReusingItsRecipient' \
            --tests '*LanSyncGroupJoiningTest.firstExplicitJoinAutomaticallySendsOneRealProofWhenProtectionStarts' \
            --tests '*LanSyncGroupJoiningTest.coldSignedLedgerForkKeepsTheSameApplicationForExplicitRecheckWithoutShelving' \
            --tests '*LanSyncGroupNodeTest.anIncompleteRecognizedHeifRetainsTheImageAndLetsBothConversationsPublish' \
            --tests '*LanSyncGroupNativeApplyOwnerTest.signedForkFinishesOnlyThePreviouslyAuthorizedNativeTransactionAndPreservesLaterEdits' \
            --tests '*LanSyncGroupNativeApplyOwnerTest.retainedMembershipForkAllowsOnlyVerifiedAppliedReceiptRepairWithoutReplayingNativeData' \
            -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g \
            --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-r08-nearby-and-join
          path: app/sharedCore/build/test-results/test/TEST-*.xml
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the selected image, edit, and exact request on Windows
        working-directory: app
        run: >-
          ./gradlew.bat :desktopApp:test
          --tests '*DesktopPhase7ImagesTest.localCameraJpegCanBePickedForComposerAndEditWithoutReencodingTheOriginal'
          --tests '*DesktopPhase7ImagesTest.highBaselineJpegUsesBoundedWireBytesForContinueRegenerateAndDirectHistory'
          --tests '*DesktopLanSyncResourceTest.malformedKnownWebpAndHeifAreHeldOnlyInTheOwningConversation'
          -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 '-Pkotlin.daemon.jvmargs=-Xmx4g'
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-r08-windows-camera-and-malformed-images
          path: app/desktopApp/build/test-results/test/TEST-*.xml
