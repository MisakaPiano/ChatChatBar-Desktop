name: Exact V5 to LAN6 real group retained Program-only upgrade
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths:
      - .github/lan-next-desktop-group-retained-upgrade-request.json
      - .github/workflows/lan-next-desktop-group-retained-upgrade.yml
permissions:
  contents: read
  actions: read
jobs:
  real-group-retained-upgrade:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Enable long source paths on this cloud runner
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bind safe failure projection to this exact group helper
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Get-FileHash -LiteralPath 'tools/lan-next-control/desktop_group_retained_upgrade_control.py' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '34d0ed9e7a64384c8016f8b5fb13405b0235ee7d6adfe888cc19cc1274e0eb67') { throw 'REAL_GROUP_SAFE_DIAGNOSTIC_BINDING' }
          Write-Output 'REAL_GROUP_SAFE_DIAGNOSTIC_V1_BOUND'
      - name: Verify exact originals then run original Main launches and separate group components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/desktop_group_retained_upgrade_control.py --request .github/lan-next-desktop-group-retained-upgrade-request.json --output desktop-group-retained-upgrade-evidence
          if ($LASTEXITCODE -ne 0) { throw 'REAL_GROUP_RETAINED_UPGRADE' }
      - name: Check isolated small output allowlist
        id: small
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/lan-next-control/desktop_group_retained_upgrade_control.py --audit-output --request .github/lan-next-desktop-group-retained-upgrade-request.json --output desktop-group-retained-upgrade-evidence
          if ($LASTEXITCODE -ne 0) { throw 'REAL_GROUP_SMALL_OUTPUT_ISOLATION' }
      - uses: actions/upload-artifact@v4
        if: always() && steps.small.outcome == 'success'
        with:
          name: lan5-lan6-desktop-real-group-retained-upgrade-small
          if-no-files-found: error
          path: |
            desktop-group-retained-upgrade-evidence/source-request.json
            desktop-group-retained-upgrade-evidence/original-provenance.json
            desktop-group-retained-upgrade-evidence/original-input-bytes.json
            desktop-group-retained-upgrade-evidence/native-lan5-lan6-group-retained-upgrade-result.json
            desktop-group-retained-upgrade-evidence/group-retained-validation.json
            desktop-group-retained-upgrade-evidence/group-component-lan5-seed.json
            desktop-group-retained-upgrade-evidence/group-component-lan5-populated.json
            desktop-group-retained-upgrade-evidence/group-component-lan5-warm-control.json
            desktop-group-retained-upgrade-evidence/group-component-lan6-upgraded.json
            desktop-group-retained-upgrade-evidence/group-component-lan6-cold-reopen.json
