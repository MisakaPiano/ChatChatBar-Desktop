name: Reply and media version scoped review
on:
  push:
    branches: [validation/reply-media-20261114]
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHATBAR_VERSION_NAME: 1.4.12-versions-v1
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f336e7602d4d1ad8dbbc78191f5df03e93d940d5
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Record source and isolated test identity
        shell: python
        run: |
          import pathlib,subprocess,json
          root=pathlib.Path.cwd();out=root/'version-review';out.mkdir()
          (out/'source.json').write_text(json.dumps(dict(source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),syntheticOnly=True,realAccountCalls=False)),encoding='utf-8')
          p=root/'app/app/build.gradle.kts';s=p.read_text();assert 'applicationId = "com.example.chatbar"' in s;p.write_text(s.replace('applicationId = "com.example.chatbar"','applicationId = "com.example.chatbar.versions.v1"'))
          p=root/'app/app/src/main/res/values/strings.xml';s=p.read_text();p.write_text(s.replace('name="app_name">ChatChatBar<','name="app_name">CCB 备选保留测试 v1<'))
          (out/'test-identity.patch').write_bytes(subprocess.check_output(['git','diff']))
      - name: Compile and run affected policy repository transfer neighbors
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*MessageAlternativeVersionPolicyTest*' --tests '*MessageFormatRepairPolicyTest*' --tests '*ReplyMediaVersionRetentionTest*' --tests '*RoleplayContentSegmentsTest*' --tests '*Moment*Test*' --tests '*ChatMessageSerializationTest*' --tests '*BackupExport*Test*' --tests '*BackupMerge*Test*' --tests '*SaveSlot*Test*' :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd app && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.chatbar.ui.chat.ReplyMediaVersionControlsTest --no-daemon --stacktrace
      - name: Verify APK identity and signature
        shell: python
        run: |
          import pathlib,subprocess,os,hashlib,json
          apk=pathlib.Path('app/app/build/outputs/apk/debug/app-debug.apk');out=pathlib.Path('version-review')
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools';tool=max((p for p in sdk.iterdir() if (p/'apksigner').is_file()),key=lambda p:tuple(int(x) for x in p.name.split('.') if x.isdigit()))
          result=subprocess.check_output([str(tool/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True);(out/'apk-signature.txt').write_text(result)
          result=subprocess.check_output([str(tool/'aapt'),'dump','badging',str(apk)],text=True);assert "name='com.example.chatbar.versions.v1'" in result;(out/'apk-badging.txt').write_text(result)
          (out/'apk-identity.json').write_text(json.dumps(dict(bytes=apk.stat().st_size,sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),signatureVerified=True,applicationId='com.example.chatbar.versions.v1')))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reply-media-review-originals
          path: |
            version-review/
            app/app/build/test-results/
            app/app/build/outputs/androidTest-results/
            app/app/build/outputs/apk/debug/
