name: V7 sourcec1a59880b42e Android87 to Windows synthetic reverse
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths:
      - .github/workflows/lan-v7-android-windows-reverse.yml
      - .github/lan-v7-reverse-request.json
      - tools/lan-next-control/v7_reverse/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reverse-debug:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Configure only the disposable cloud checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          path: reverse-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MisakaPiano/ChatChatBar-Desktop
          ref: c1a59880b42e4d6097801d4d641dde9fdaa2a8e9
          path: reverse-android
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MisakaPiano/ChatChatBar-Desktop
          ref: c1a59880b42e4d6097801d4d641dde9fdaa2a8e9
          path: reverse-windows
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator system-images;android-26;google_apis;x86_64 platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run two exact native targets through fixed isolated reverse TLS route
        working-directory: reverse-control
        timeout-minutes: 65
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B tools/lan-next-control/v7_reverse/run_reverse_cloud.py
          --request .github/lan-v7-reverse-request.json
          --android-source ../reverse-android
          --windows-source ../reverse-windows
          --evidence evidence-reverse
          --fixed-sha256 f7fbba3f28d4d6d7e16e8c8f281e8c552dc6ba7a100911ed53de7b6495e263d3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-android87-windows-reverse-safe-results
          path: |
            reverse-control/evidence-reverse/run.json
            reverse-control/evidence-reverse/debug-build.json
            reverse-control/evidence-reverse/android.json
            reverse-control/evidence-reverse/windows.json
            reverse-control/evidence-reverse/windows-junit.json
          if-no-files-found: error
          retention-days: 5
