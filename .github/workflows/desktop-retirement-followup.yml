name: Retirement affected native and UI follow-up
on:
  push:
    branches: ['codex/desktop-retirement-followup-*']
permissions:
  contents: read
jobs:
  followup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce original two completion refusals with actual isolated owner logs
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, shutil, subprocess, sys, unittest
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'retirement-followup');out.mkdir()
          base=out/'frozen-8b0';base.mkdir()
          for leaf in ('nsis','update'): shutil.copytree(pathlib.Path('tools/desktop')/leaf,base/leaf)
          original=subprocess.check_output(['git','show','8b0a1074e54971ffb60a18f70acdcfd5849c9563:tools/desktop/nsis/Launcher.cs'])
          (base/'nsis/Launcher.cs').write_bytes(original)
          sys.path.insert(0,str(base/'nsis'));sys.path.insert(0,str(base/'update'))
          import test_lifecycle
          suite=unittest.TestSuite(test_lifecycle.Lifecycle(n) for n in ['test_first_start_and_upgrade_retire_only_owned_files','test_fresh_installer_repairs_corrupt_same_version_without_running_damaged_program'])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          failures=[dict(test=n.id(),traceback=t) for n,t in result.failures]
          reproduced=result.testsRun==2 and len(failures)==2 and not result.errors and all('FAILED CLEANUP_COMPLETION_IDENTITY' in x['traceback'] for x in failures)
          (out/'frozen-original-refusals.json').write_text(json.dumps(dict(source='8b0a1074e54971ffb60a18f70acdcfd5849c9563',tests=result.testsRun,result='REPRODUCED_IDENTITY_REFUSAL' if reproduced else 'UNCLASSIFIED',failures=failures,errors=[dict(test=n.id(),traceback=t) for n,t in result.errors]),indent=2))
          sys.exit(not reproduced)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify changed native completion refusals, protected unknown files and handoff cwd
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, sys, unittest
          sys.path.insert(0,str(pathlib.Path('tools/desktop/nsis').resolve()))
          sys.path.insert(0,str(pathlib.Path('tools/desktop/update').resolve()))
          import test_lifecycle, test_handoff
          selected=['test_first_start_and_upgrade_retire_only_owned_files','test_unconfirmed_completion_cannot_grant_old_program_retirement','test_fresh_installer_repairs_corrupt_same_version_without_running_damaged_program','test_completion_accepts_same_directory_case_and_short_long_aliases_only','test_completed_upgrade_retires_readonly_predecessor_but_never_pending_stage','test_completed_busy_predecessor_is_retried_on_next_normal_launch','test_new_completed_install_releases_verified_legacy_repair_chain_and_entry_backups','test_present_unconfirmed_repair_target_never_loses_its_pending_custody','test_completed_cutover_retires_verified_legacy_ordinary_residue_but_preserves_changed_and_pending']
          suite=unittest.TestSuite([test_lifecycle.Lifecycle(n) for n in selected])
          suite.addTests(unittest.defaultTestLoader.loadTestsFromTestCase(test_handoff.HandoffTest))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'retirement-followup')
          (out/'original.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],tests=result.testsRun,failures=[dict(test=n.id(),traceback=t) for n,t in result.failures],errors=[dict(test=n.id(),traceback=t) for n,t in result.errors],skipped=[dict(test=n.id(),reason=t) for n,t in result.skipped],scope='Tiny native synthetic managers/executables only; no ordinary NSIS or user profile; fourteen affected test methods'),indent=2))
          sys.exit(not result.wasSuccessful())
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signed cache ownership and Windows root spelling after identity correction
        shell: pwsh
        run: |
          python -m pip install tuf==7.0.1 securesystemslib[crypto]==1.6.0 urllib3==2.8.0 PySocks==1.7.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os, pathlib, sys, unittest
          sys.path.insert(0,str(pathlib.Path('tools/desktop/update').resolve()))
          import test_client
          names=[name for name in dir(test_client.ClientTest) if name.startswith('test_') and any(part in name for part in ('cleanup','completion','selected_current_version'))]
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(test_client.ClientTest(n) for n in names))
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'retirement-followup')
          (out/'cache-original.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],tests=result.testsRun,selected=names,failures=[dict(test=n.id(),traceback=t) for n,t in result.failures],errors=[dict(test=n.id(),traceback=t) for n,t in result.errors],skipped=[dict(test=n.id(),reason=t) for n,t in result.skipped]),indent=2))
          sys.exit(not result.wasSuccessful())
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual UI update owner after deferred task projection
        working-directory: app
        run: .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain --tests com.example.chatbar.desktop.DesktopUpdateWorkOwnershipTest --tests com.example.chatbar.desktop.DesktopUpdateCacheSummaryTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-followup-original-results
          path: |
            ${{ runner.temp }}/retirement-followup/
            app/desktopApp/build/test-results/test/
          if-no-files-found: warn
