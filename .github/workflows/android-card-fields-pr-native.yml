name: Android card fields exact PR native
on:
  push:
    branches: [validation/android-card-fields-pr-native-20261118]
concurrency:
  group: android-card-fields-pr-native
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CHATBAR_VERSION_NAME: 1.4.12-next-review-r3
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/card_fields_pr_native.py /tmp/card_fields_pr_native.py
      - uses: actions/checkout@v4
        with:
          ref: bd7fc1225d8a86cc9feeba35babc38dc827ed785
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exact PR new controls API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/card_fields_pr_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-card-fields-pr-native-originals
          path: |
            card-fields-pr-native/
            app/app/build/outputs/androidTest-results/
            app/app/build/reports/androidTests/
            app/app/build/reports/tests/
          retention-days: 14
