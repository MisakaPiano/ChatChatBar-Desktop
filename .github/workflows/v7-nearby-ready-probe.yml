name: V7 automatic join nearby listener probe
on:
  push:
    branches: [codex/v7-nearby-ticker-probe-20261123]
    paths:
      - .github/workflows/v7-nearby-ready-probe.yml
      - app/sharedCore/src/test/kotlin/com/example/chatbar/domain/lanSync/LanSyncGroupJoiningTest.kt
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Hold the first local check after a genuine signed automatic join
        working-directory: app
        run: >-
          bash ./gradlew :sharedCore:test
          --tests '*LanSyncGroupJoiningTest.automaticSignedJoinCanBindNearbyWhileItsFirstReadyInspectionIsBlocked'
          -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=87 -Pkotlin.daemon.jvmargs=-Xmx4g
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-nearby-ready-probe
          path: app/sharedCore/build/test-results/test/TEST-*.xml
