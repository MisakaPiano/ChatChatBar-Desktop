name: Desktop NovelAI batch policy focused verification
on:
  push:
    branches: [codex/desktop-novelai-safe-batch-20261114]
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared and test batch plan and full preset custody
        working-directory: app
        run: bash gradlew :sharedCore:test --tests 'com.example.chatbar.domain.image.ImageBatchRunPlanTest' --tests 'com.example.chatbar.domain.image.NovelAiBatchPresetCustodyTest' --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-novelai-batch-focused-reports
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
