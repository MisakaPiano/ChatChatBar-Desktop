name: Desktop NovelAI batch policy focused verification
on:
  push:
    branches: [codex/desktop-novelai-safe-batch-20261114]
  workflow_dispatch:
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Enable Windows long path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Desktop batch orchestration ownership persistence and narrow UI
        working-directory: app
        env:
          CCB_IMAGE_BATCH_REVIEW_DIR: ${{ runner.temp }}/ccb-image-batch-review
        # Other64 methods passed on frozen productionf7ba98d0; only the Scene animation clock changed.
        run: .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopImageBatchOptionsTest' --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-novelai-batch-ui-runtime-reports
          path: |
            app/desktopApp/build/test-results/test/
            app/desktopApp/build/reports/tests/test/
            ${{ runner.temp }}/ccb-image-batch-review/
