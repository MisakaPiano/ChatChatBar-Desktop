name: Android functional alignment verification and phone APK
on:
  push:
    branches: [ci/upstream-functional-alignment-20261108]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: b8fb9679d71071afd6ad944b19d9ef0e4c67d7c8
  TEST_APPLICATION_ID: com.example.chatbar.alignment.a1
  CHATBAR_SILICONFLOW_API_KEY: ''
  CHATBAR_SUPABASE_URL: ''
  CHATBAR_SUPABASE_ANON_KEY: ''
  CHATBAR_SUPABASE_REDIRECT_URI: chatbar-alignment-a1://auth/callback
jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b8fb9679d71071afd6ad944b19d9ef0e4c67d7c8
          persist-credentials: false
          fetch-depth: 8
      - name: Verify immutable contribution source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = "48c884f6cc31b6c4e4c672aa5f382e43f2af12d3"
          mkdir -p phone-test-output
          git rev-parse HEAD HEAD^{tree} > phone-test-output/SOURCE_IDENTITY.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set co-install test identity only
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          gradle = Path('app/app/build.gradle.kts')
          text = gradle.read_text()
          old = 'applicationId = "com.example.chatbar"'
          assert text.count(old) == 1
          gradle.write_text(text.replace(old, 'applicationId = "' + os.environ['TEST_APPLICATION_ID'] + '"'))
          manifest = Path('app/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          old_label = 'android:label="@string/app_name"'
          old_scheme = 'android:scheme="chatbar"'
          assert text.count(old_label) == 1 and text.count(old_scheme) == 1
          text = text.replace(old_label, 'android:label="CCB 功能对齐测试 a1"')
          text = text.replace(old_scheme, 'android:scheme="chatbar-alignment-a1"')
          manifest.write_text(text)
          PY
      - uses: actions/cache/restore@v4
        id: compiler_cache
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.3.20/002fac4210c52c27b244305d60b0906e831f49be
          key: verified-official-kotlin-compiler-2.3.20-976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337
      - uses: actions/cache/restore@v4
        id: compiler_parts
        continue-on-error: true
        if: steps.compiler_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccb-official-compiler-parts
          key: kotlin-parts-976f989d-v1-${{ github.run_id }}
          restore-keys: kotlin-parts-976f989d-v1-
      - name: Verify official compiler with bounded range transport after full download timeout
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, time
          from pathlib import Path
          root = Path('phone-test-output/compiler-proof')
          root.mkdir(parents=True, exist_ok=True)
          sha1 = '002fac4210c52c27b244305d60b0906e831f49be'
          sha256 = '976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337'
          total = 59718536
          cache = Path(os.environ['GRADLE_USER_HOME']) / 'caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.3.20' / sha1
          cache.mkdir(parents=True, exist_ok=True)
          target = cache / 'kotlin-compiler-embeddable-2.3.20.jar'
          url = 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.3.20/kotlin-compiler-embeddable-2.3.20.jar'
          parts = Path.home() / '.cache/ccb-official-compiler-parts'
          parts.mkdir(parents=True, exist_ok=True)
          staged = Path(os.environ['RUNNER_TEMP']) / 'verified-compiler'
          staged.mkdir(exist_ok=True)
          whole = staged / 'compiler.jar'
          proof = {'officialUrl':url,'expectedBytes':total,'expectedSha1':sha1,'expectedSha256':sha256,'sourceOrDependencyRepositoryChanged':False,'parts':[]}
          offsets = list(range(0,total,2*1024*1024))
          deadline = time.monotonic() + 600
          def good(part, start):
              try:
                  meta = part.with_suffix('.json')
                  if not part.is_file() or not meta.is_file(): return False
                  d = json.loads(meta.read_text())
                  return d['start'] == start and part.stat().st_size == min(2*1024*1024,total-start) and hashlib.sha256(part.read_bytes()).hexdigest() == d['sha256']
              except (OSError,ValueError,KeyError): return False
          try:
              if target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest() == sha256:
                  shutil.copyfile(target,whole)
                  proof['cacheReuse'] = True
              else:
                  full = False
                  for wave in range(2):
                      for start in offsets:
                          final = parts / (str(start)+'.part')
                          if good(final,start): continue
                          if time.monotonic() >= deadline: break
                          end = min(start+2*1024*1024-1,total-1)
                          part = staged / 'part'
                          part.unlink(missing_ok=True)
                          headers = staged / 'headers.txt'
                          result = subprocess.run(['curl','--fail','--silent','--show-error','--location','--max-time','30','--write-out','%{http_code}','--range',str(start)+'-'+str(end),'--dump-header',str(headers),'--output',str(part),url+'?ccbSegment='+str(start)], capture_output=True, text=True)
                          size = part.stat().st_size if part.exists() else 0
                          status = result.stdout.strip()
                          item = {'wave':wave+1,'start':start,'end':end,'exitCode':result.returncode,'httpStatus':status,'bytes':size}
                          proof['parts'].append(item)
                          if status in ('401','403'): raise RuntimeError('Official source denied access; no alternate route or retry')
                          if result.returncode:
                              print('Compiler segment unavailable',item,result.stderr.strip())
                              continue
                          if size == total and hashlib.sha256(part.read_bytes()).hexdigest() == sha256:
                              shutil.copyfile(part,whole);full = True;break
                          if size != end-start+1 or ('content-range: bytes '+str(start)+'-'+str(end)+'/'+str(total)) not in headers.read_text().lower():
                              raise RuntimeError('Official range response length or Content-Range mismatch')
                          part.replace(final)
                          final.with_suffix('.json').write_text(json.dumps({'start':start,'sha256':hashlib.sha256(final.read_bytes()).hexdigest()}))
                      if full or all(good(parts/(str(start)+'.part'),start) for start in offsets): break
                  valid = [start for start in offsets if good(parts/(str(start)+'.part'),start)]
                  proof['cachedValidParts'] = len(valid)
                  proof['missingParts'] = [start for start in offsets if start not in valid]
                  if not full:
                      if len(valid) != len(offsets): raise RuntimeError('Official dependency still incomplete; validated pieces retained for bounded resume, no Gradle/tests')
                      with whole.open('wb') as combined:
                          for start in offsets: combined.write((parts/(str(start)+'.part')).read_bytes())
              data = whole.read_bytes()
              assert len(data) == total and hashlib.sha1(data).hexdigest() == sha1 and hashlib.sha256(data).hexdigest() == sha256
              proof['actualSha256'] = hashlib.sha256(data).hexdigest()
              proof['verified'] = True
              shutil.copyfile(whole,target)
          finally:
              proof['cachedValidParts'] = sum(good(parts/(str(start)+'.part'),start) for start in offsets)
              (root/'compiler-transport-proof.json').write_text(json.dumps(proof,indent=2))
          PY
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: always() && steps.compiler_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccb-official-compiler-parts
          key: kotlin-parts-976f989d-v1-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: steps.compiler_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.3.20/002fac4210c52c27b244305d60b0906e831f49be
          key: verified-official-kotlin-compiler-2.3.20-976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337
      - name: Compile and check affected unit behavior
        working-directory: app
        run: |
          bash ./gradlew :app:testDebugUnitTest --tests '*WorldBookEngineTest' --tests '*WorldBookEntryModalStateTest' --tests '*FunctionalAlignmentPolicyTest' --tests '*CharacterParticipationBackupIdentityTest' --tests '*PromptAssemblerCharacterModeTest' --tests '*MomentMediaRetentionTest' --tests '*SessionCopyPolicyTest' :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
          mkdir -p ../phone-test-output/unit
          cp -R app/build/test-results/testDebugUnitTest/. ../phone-test-output/unit/
      - name: Build installable debug test APK
        working-directory: app
        run: bash ./gradlew :app:assembleDebug -PCHATBAR_VERSION_NAME=1.4.10-functional-alignment-a1 --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
      - name: Prepare device regression and unfixed control script
        run: |
          cat > "$RUNNER_TEMP/run-worldbook-checks.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          vm="$GITHUB_WORKSPACE/app/app/src/main/java/com/example/chatbar/ui/worldbook/WorldBookEditViewModel.kt"
          saved="$RUNNER_TEMP/worldbook-fixed-vm.kt"
          out="$GITHUB_WORKSPACE/phone-test-output"
          cp "$vm" "$saved"
          finish() {
            cp "$saved" "$vm"
            if test -d app/build/outputs/androidTest-results/connected; then
              mkdir -p "$out/last-device-results"
              cp -R app/build/outputs/androidTest-results/connected/. "$out/last-device-results/"
            fi
          }
          trap finish EXIT
          bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.chatbar.ui.worldbook.WorldBookQuickToggleViewModelTest,com.example.chatbar.ui.worldbook.WorldBookEntryListItemTest,com.example.chatbar.ui.character.CharacterDraftDiscardTest,com.example.chatbar.domain.card.CharacterBackgroundGalleryTransferTest,com.example.chatbar.ui.chat.SessionCharacterRebindTest,com.example.chatbar.ui.components.ChatBackgroundGalleryTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8'
          mkdir -p "$out/screenshots"
          adb pull "/sdcard/Android/data/$TEST_APPLICATION_ID/files/worldbook-toggle-evidence/." "$out/screenshots/"
          adb pull "/sdcard/Android/data/$TEST_APPLICATION_ID/files/alignment-evidence/." "$out/screenshots/"
          mkdir -p "$out/fixed"
          cp -R app/build/outputs/androidTest-results/connected/. "$out/fixed/"
          git show d200148e7ea43d8aed69022bd1ea9c47d9343d66:app/app/src/main/java/com/example/chatbar/ui/worldbook/WorldBookEditViewModel.kt > "$vm"
          set +e
          bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.chatbar.ui.worldbook.WorldBookQuickToggleViewModelTest#discardRestoresEnabledBeforeSameEditorReopens -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8'
          red_exit=$?
          set -e
          test "$red_exit" -ne 0
          mkdir -p "$out/unfixed-control"
          cp -R app/build/outputs/androidTest-results/connected/. "$out/unfixed-control/"
          cp "$saved" "$vm"
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          from xml.etree import ElementTree as E
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'phone-test-output'
          def results(folder):
              cases = []
              for p in (out / folder).rglob('TEST-*.xml'):
                  for c in E.parse(p).getroot().iter('testcase'):
                      cases.append({'class':c.get('classname'), 'name':c.get('name'),
                                    'failure': c.find('failure') is not None,
                                    'error': c.find('error') is not None,
                                    'skipped': c.find('skipped') is not None,
                                    'failureText': ''.join(c.find('failure').itertext()) if c.find('failure') is not None else ''})
              return cases
          green = results('fixed')
          assert len(green) == 21, green
          assert not any(c['failure'] or c['error'] or c['skipped'] for c in green), green
          red = results('unfixed-control')
          assert len(red) == 1 and red[0]['name'] == 'discardRestoresEnabledBeforeSameEditorReopens', red
          assert red[0]['failure'] and not red[0]['error'], red
          assert 'Discarded entry enabled flag must be restored' in red[0]['failureText'], red
          unit = results('unit')
          assert len(unit) > 0 and not any(c['failure'] or c['error'] or c['skipped'] for c in unit), unit
          summary = {'fixedDeviceTests':green, 'fixedUnitTests':unit,
                     'unfixedControl':red, 'unfixedControlExpectedAssertionFailureConfirmed':True,
                     'controlScope':'Same fixed source and synthetic fixture; only WorldBookEditViewModel replaced with exact original d200 source; restored before final APK build',
                     'scope':'21 scoped Android cases: worldbook/card draft, row/gallery UI, media transfer and actual ViewModel rebind; synthetic-only, no paid requests or full navigation end-to-end'}
          (out / 'TEST_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          # The control test installed the unfixed app in the cloud emulator. Rebuild the fixed source for delivery.
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash ./gradlew :app:assembleDebug -PCHATBAR_VERSION_NAME=1.4.10-functional-alignment-a1 --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
          SH
      - name: Enable cloud runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify aligned controls, gallery, transfer, actual ViewModels and original regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          script: bash "$RUNNER_TEMP/run-worldbook-checks.sh"
      - name: Verify package, signature and exact build scope
        run: |
          mkdir -p phone-test-output
          cp app/app/build/outputs/apk/debug/app-debug.apk phone-test-output/CCB-functional-alignment-a1-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging phone-test-output/CCB-functional-alignment-a1-test.apk > phone-test-output/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree phone-test-output/CCB-functional-alignment-a1-test.apk AndroidManifest.xml > phone-test-output/apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs phone-test-output/CCB-functional-alignment-a1-test.apk > phone-test-output/apk-signature.txt
          python3 - <<'PY'
          import os, json, hashlib, subprocess
          from pathlib import Path
          out = Path('phone-test-output')
          apk = out / 'CCB-functional-alignment-a1-test.apk'
          badging = (out / 'apk-badging.txt').read_text()
          manifest = (out / 'apk-manifest.txt').read_text()
          assert "name='" + os.environ['TEST_APPLICATION_ID'] + "'" in badging
          assert "versionName='1.4.10-functional-alignment-a1'" in badging
          assert 'CCB 功能对齐测试 a1' in badging
          assert os.environ['TEST_APPLICATION_ID'] + '.fileprovider' in manifest
          assert 'chatbar-alignment-a1' in manifest
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert set(changed) == {'app/app/build.gradle.kts','app/app/src/main/AndroidManifest.xml'}
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert source == os.environ['SOURCE_SHA']
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256.txt').write_text(digest + '  ' + apk.name + '\n')
          info = {'source': source, 'sourceTree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'applicationId':os.environ['TEST_APPLICATION_ID'], 'label':'CCB 功能对齐测试 a1',
                  'versionName':'1.4.10-functional-alignment-a1','variant':'debug','apk':apk.name,'bytes':apk.stat().st_size,
                  'sha256':digest,'buildOnlyChanges':changed,'identityOnly':True,
                  'tests':json.loads((out / 'TEST_SUMMARY.json').read_text()),
                  'privateKeysOrUserDataInjected':False,'installedOnDevice':False,
                  'cloudRun':'https://github.com/MisakaPiano/ChatChatBar-Desktop/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          (out / 'BUILD_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2))
          print(json.dumps(info,ensure_ascii=False,indent=2))
          PY
      - name: Preserve failure results
        if: failure()
        run: |
          mkdir -p phone-test-output/failure
          cp -R app/app/build/outputs/androidTest-results/connected phone-test-output/failure/ 2>/dev/null || true
          cp -R app/app/build/test-results/testDebugUnitTest phone-test-output/failure/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-alignment-a1-phone-test-${{ github.run_id }}
          path: phone-test-output/
          retention-days: 14

