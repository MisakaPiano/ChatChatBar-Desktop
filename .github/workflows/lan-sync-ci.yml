name: Isolated LAN sync engineering
on:
  push:
    branches: ['codex/lan-sync-*']
    paths-ignore: [.github/lan-sync-package-request.json, .github/lan-sync-device-request.json, .github/lan-sync-apk-request.json, .github/lan-sync-group-device-request.json]
permissions:
  contents: read
jobs:
  group-large-resources:
    needs: android
    if: needs.android.outputs.group_large == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCB_GROUP_LARGE_PROOF: 'true'
      CCB_GROUP_LARGE_TLS_PROOF: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fully written encrypted group and native v8 proof
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :sharedCore:test --tests 'com.example.chatbar.domain.syncStoreProof.SyncGroupLargeNativeProofTest' --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-group-large-resource-evidence
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
  large-resources:
    needs: android
    if: needs.android.outputs.legacy_large == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCB_LAN_LARGE_PROOF: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fully written large Runtime and v8 proof
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :sharedCore:test --tests 'com.example.chatbar.domain.lanSyncProof.LanSyncLargeRuntimeProofTest' --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lan-sync-large-resource-evidence
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      legacy_large: ${{ steps.proof_scope.outputs.legacy_large }}
      group_large: ${{ steps.proof_scope.outputs.group_large }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select changed transport proof scope
        id: proof_scope
        env:
          CCB_SYNC_DIFF_BASE: ${{ github.event.before }}
        run: |
          python -m unittest discover -s tools/lan-sync/tests -p test_proof_scope.py
          python -m unittest discover -s tools/lan-next-control -p test_instrumentation_report.py
          python tools/lan-sync/select-proof-scope.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared protocol tests and Android compilation
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :sharedCore:test --tests 'com.example.chatbar.domain.lanSync.*' --tests 'com.example.chatbar.domain.syncStore.*' :app:compileLanPreviewKotlin :app:assembleLanPreview :app:compileLanPreviewAndroidTestKotlin -PlanSyncDeviceTests=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lan-sync-android-evidence
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
      - uses: actions/upload-artifact@v4
        with:
          name: ccb-lan-preview-android
          path: app/app/build/outputs/apk/lanPreview/*.apk
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CCB_LAN_SENSITIVE_CLIPBOARD_PROOF: 'true'
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record native path evidence and use a canonical NTFS temporary root
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path ($env:SystemDrive + '\') ('lt' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          $evidence = New-Item -ItemType Directory -Path (Join-Path $base 'evidence') -ErrorAction Stop
          & java "$env:GITHUB_WORKSPACE/tools/lan-sync/StartupPathEvidence.java" | Set-Content (Join-Path $evidence 'original-temp.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_PATH_EVIDENCE_FAILED' }
          $taskTemp = New-Item -ItemType Directory -Path (Join-Path $base 'temp') -ErrorAction Stop
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($base)).DriveFormat -ne 'NTFS') { throw 'NTFS_REQUIRED' }
          $env:TEMP = $taskTemp.FullName; $env:TMP = $taskTemp.FullName
          & java "$env:GITHUB_WORKSPACE/tools/lan-sync/StartupPathEvidence.java" | Set-Content (Join-Path $evidence 'canonical-temp.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'CANONICAL_PATH_EVIDENCE_FAILED' }
          @("TEMP=$env:TEMP", "TMP=$env:TMP", "CCB_LAN_TEST_ENV=$($evidence.FullName)") | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Desktop compilation
        working-directory: app
        run: .\gradlew.bat :desktopApp:test --tests '*DesktopUpdateNoticesTest*' --tests '*DesktopStartupGateTest*' --tests '*DesktopLanSync*' --tests '*DormantPreservationPreparationTest*' --tests '*DesktopPreservationStoreTest*' --tests '*DesktopMomentVersionBackupTest*' --tests '*DesktopFullBackupWriterTest*' --tests '*DesktopMomentAdmissionStoreTest*' --tests '*DesktopPostProcessResultsTest*' --tests '*DesktopPostProcessRetainedMediaTest*' --tests '*DesktopPostProcessSourceIdentityTest*' --tests '*DesktopStudioDraftHistoryTest*' --no-daemon --stacktrace
      - name: Require actual synthetic native clipboard execution
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$report = Get-Content -LiteralPath 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopLanSyncSensitiveClipboardTest.xml' -Raw
          $suite = $report.testsuite
          if ($suite.tests -ne '1' -or $suite.failures -ne '0' -or $suite.errors -ne '0' -or $suite.skipped -ne '0') { throw 'SENSITIVE_CLIPBOARD_PROOF_NOT_EXECUTED_SUCCESSFULLY' }
          $cases = @($suite.testcase)
          if ($cases.Count -ne 1 -or $cases[0].name -ne 'sensitive native copy publishes exact Unicode plus exclusion marker and refuses a foreign owner' -or $cases[0].skipped) { throw 'SENSITIVE_CLIPBOARD_PROOF_CASE_MISMATCH' }
      - name: Collect original results within one artifact root
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $target = New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE 'lan-sync-desktop-evidence') -ErrorAction Stop
          $results = Join-Path $env:GITHUB_WORKSPACE 'app/desktopApp/build/test-results/test'
          if (Test-Path -LiteralPath $results) { Copy-Item -LiteralPath $results -Destination (Join-Path $target 'test-results') -Recurse }
          if ($env:CCB_LAN_TEST_ENV -and (Test-Path -LiteralPath $env:CCB_LAN_TEST_ENV)) { Copy-Item -LiteralPath $env:CCB_LAN_TEST_ENV -Destination (Join-Path $target 'native-path-evidence') -Recurse }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lan-sync-desktop-evidence
          path: lan-sync-desktop-evidence/
