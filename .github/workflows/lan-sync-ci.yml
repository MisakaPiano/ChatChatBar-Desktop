name: Isolated LAN sync engineering
on:
  push:
    branches: ['codex/lan-sync-*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared protocol tests and Android compilation
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :sharedCore:test --tests 'com.example.chatbar.domain.lanSync.*' :app:compileDebugKotlin --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lan-sync-android-evidence
          path: |
            app/sharedCore/build/test-results/test/
            app/sharedCore/build/reports/tests/test/
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop compilation
        working-directory: app
        run: .\gradlew.bat :desktopApp:compileKotlin --no-daemon --stacktrace
