name: Desktop message owner scope and index proof
on:
  push:
    branches: [codex/desktop-owner-scope-20261126]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-owner-scope-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind canonical synthetic directory and exact source
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ccb-owner-scope'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Add-Type 'using System.Text; using System.Runtime.InteropServices; public static class OwnerFixturePath { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetLongPathName(string path, StringBuilder result, uint size); }'
          $buffer = New-Object System.Text.StringBuilder 32768
          if ([OwnerFixturePath]::GetLongPathName($folder, $buffer, 32768) -eq 0) { throw 'FIXTURE_NATIVE_PATH_UNCONFIRMED' }
          "TEMP=$buffer" >> $env:GITHUB_ENV
          "TMP=$buffer" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path 'owner-review' | Out-Null
          git rev-parse HEAD | Set-Content 'owner-review/source.txt'
          git rev-parse 'HEAD^{tree}' | Set-Content 'owner-review/tree.txt'
      - name: Reproduce foreign owner deletion with fixed old repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = '485b721b0d85448cbe8eec986691ccef8012e3ca'
          $file = 'app/sharedCore/src/main/kotlin/com/example/chatbar/data/repository/ChatRepository.kt'
          git fetch origin $prior --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'PRIOR_SOURCE_UNAVAILABLE' }
          try {
            git restore --source=$prior --worktree -- $file
            Push-Location app
            try {
              .\gradlew.bat :sharedCore:test --tests 'com.example.chatbar.data.repository.ChatMessageOwnerScopeTest.clear parent session preserves decoded child owner bytes' --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            $path = 'app/sharedCore/build/test-results/test/TEST-com.example.chatbar.data.repository.ChatMessageOwnerScopeTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $path
            if ($negativeExit -ne 1 -or $report.testsuite.tests -ne '1' -or $report.testsuite.failures -ne '1' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'PRIOR_OWNER_ASSERTION_NOT_REACHED' }
            if ($report.testsuite.testcase.failure.type -notlike '*Assertion*') { throw 'PRIOR_OWNER_WRONG_FAILURE' }
            Copy-Item -LiteralPath $path -Destination 'owner-review/negative-owner-clear.xml'
            $prior | Set-Content 'owner-review/negative-source.txt'
          } finally {
            git restore --source=HEAD --worktree -- $file
            git diff --exit-code -- $file
            if ($LASTEXITCODE -ne 0) { throw 'CURRENT_SOURCE_NOT_RESTORED' }
          }
      - name: Verify owner scope storage and conditional repository boundaries
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests 'com.example.chatbar.data.repository.ChatMessageOwnerScopeTest'
          --tests 'com.example.chatbar.data.repository.ChatRepositoryConditionalUpdateTest'
          --tests 'com.example.chatbar.data.local.JsonFileStorageTest'
          --tests 'com.example.chatbar.data.local.JsonFileStorageEdgeCaseTest'
          --tests 'com.example.chatbar.data.local.JsonFileStorageOperationGateTest'
          --no-daemon --stacktrace
      - name: Verify actual desktop restore backup mapping and dependent owners
        working-directory: app
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.backup.DesktopMessageOwnerIndexTransferTest'
          --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest'
          --tests 'com.example.chatbar.desktop.DesktopFullBackupMappingTest'
          --tests 'com.example.chatbar.desktop.DesktopSessionImageGalleryTest'
          --tests 'com.example.chatbar.desktop.DesktopAlternativeUnlinkRecoveryTest'
          --tests 'com.example.chatbar.desktop.DesktopRemovedAlternativeVoiceTest'
          -PdesktopTestHeadless=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-owner-scope-original-results
          path: |
            owner-review/
            app/sharedCore/build/test-results/test/
            app/desktopApp/build/test-results/test/
