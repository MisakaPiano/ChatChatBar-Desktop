name: Focused cloud remaining original graphical Desktop cases

on:
  push:
    branches: ['codex/desktop-native-probe-*']

permissions:
  contents: read

concurrency:
  group: desktop-native-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Enable long-path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record owned cloud desktop scope and fresh NTFS temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path ($env:SystemDrive + '\') ('n' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($probeRoot)).DriveFormat -ne 'NTFS') { throw 'NATIVE_PROBE_NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          $testTemp = New-Item -ItemType Directory -Path (Join-Path $probeRoot 'temp') -ErrorAction Stop
          $evidence = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ccb-native-probe') -ErrorAction Stop
          @("TEMP=$($testTemp.FullName)", "TMP=$($testTemp.FullName)") | Add-Content $env:GITHUB_ENV -Encoding utf8
          [ordered]@{ source=(git rev-parse HEAD); run=$env:GITHUB_RUN_ID; graphicalTestMode=$true; userInteractive=[Environment]::UserInteractive; processSession=(Get-Process -Id $PID).SessionId; scope='Only three full155 failures, directly affected source geometry and current Studio OS-close; no installer, real provider or user profile' } | ConvertTo-Json | Set-Content (Join-Path $evidence 'source.json') -Encoding utf8
      - name: Prepare supported temporary cloud display and record actual audio inventory
        shell: pwsh
        run: ./tools/windows/Set-CloudNativeProbeDisplay.ps1
      - name: Execute only affected native scopes with unchanged input and geometry assertions
        shell: pwsh
        working-directory: app
        env:
          CCB_FORMAT_AI_REVIEW_DIR: ${{ runner.temp }}/ccb-native-probe/images
        run: |
          .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=false --no-daemon --stacktrace --console=plain `
            --tests 'com.example.chatbar.desktop.DesktopReverseSceneTest.source or scene replacement while undo save is suspended refuses old candidate at actual draft commit' `
            --tests 'com.example.chatbar.desktop.DesktopReverseSceneTest.stop or newer scene during original preflight prevents recognition and old confirmation from launching' `
            --tests com.example.chatbar.desktop.DesktopStudioTranslatedCaretTest `
            --tests 'com.example.chatbar.desktop.DesktopStudioInputHistorySceneTest.actual platform request uses live moved editor coordinates and preserves composing source text' `
            --tests 'com.example.chatbar.desktop.DesktopStudioInputHistorySceneTest.rendered selection highlights source glyph band and leaves annotation row unselected' `
            --tests 'com.example.chatbar.desktop.DesktopDesignParityTest.real Studio auxiliary OS close runs leave semantics'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore original temporary runner display
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'ccb-native-probe/display-original.json')) {
            ./tools/windows/Set-CloudNativeProbeDisplay.ps1 -Restore
          }
      - name: Retain actual original XML and runner scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-probe-reports
          path: |
            app/desktopApp/build/test-results/test/
            app/desktopApp/build/reports/tests/test/
            app/desktopApp/build/phase7-slice-c-scheme-a-r1-evidence/native/
            ${{ runner.temp }}/ccb-native-probe/
          if-no-files-found: error
