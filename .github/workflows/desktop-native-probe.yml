name: Focused cloud native Desktop owner and auxiliary close verification

on:
  push:
    branches: ['codex/desktop-native-probe-*']

permissions:
  contents: read

concurrency:
  group: desktop-native-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Enable long-path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record owned cloud desktop scope and fresh NTFS temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path ($env:SystemDrive + '\') ('n' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($probeRoot)).DriveFormat -ne 'NTFS') { throw 'NATIVE_PROBE_NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          $testTemp = New-Item -ItemType Directory -Path (Join-Path $probeRoot 'temp') -ErrorAction Stop
          $evidence = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ccb-native-probe') -ErrorAction Stop
          @("TEMP=$($testTemp.FullName)", "TMP=$($testTemp.FullName)") | Add-Content $env:GITHUB_ENV -Encoding utf8
          [ordered]@{ source=(git rev-parse HEAD); run=$env:GITHUB_RUN_ID; graphicalTestMode=$true; userInteractive=[Environment]::UserInteractive; processSession=(Get-Process -Id $PID).SessionId; scope='Only original synthetic HWND-owner and Studio auxiliary-close cases on cloud runner; no installer, real provider, user profile or physical audio acceptance' } | ConvertTo-Json | Set-Content (Join-Path $evidence 'source.json') -Encoding utf8
      - name: Execute only original native owner and Studio OS-close cases
        shell: pwsh
        working-directory: app
        env:
          CCB_FORMAT_AI_REVIEW_DIR: ${{ runner.temp }}/ccb-native-probe/images
        run: |
          .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=false --no-daemon --stacktrace --console=plain `
            --tests 'com.example.chatbar.desktop.WindowsNativeDialogIntegrationTest' `
            --tests 'com.example.chatbar.desktop.DesktopDesignParityTest.real Studio auxiliary OS close runs leave semantics'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual original XML and runner scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-probe-reports
          path: |
            app/desktopApp/build/test-results/test/
            app/desktopApp/build/reports/tests/test/
            ${{ runner.temp }}/ccb-native-probe/
          if-no-files-found: error
