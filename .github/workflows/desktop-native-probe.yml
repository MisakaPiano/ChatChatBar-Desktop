name: Focused cloud remaining original graphical Desktop cases

on:
  push:
    branches: ['codex/desktop-native-probe-*']

permissions:
  contents: read

concurrency:
  group: desktop-native-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Enable long-path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record owned cloud desktop scope and fresh NTFS temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path ($env:SystemDrive + '\') ('n' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($probeRoot)).DriveFormat -ne 'NTFS') { throw 'NATIVE_PROBE_NTFS_REQUIRED' }
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          $testTemp = New-Item -ItemType Directory -Path (Join-Path $probeRoot 'temp') -ErrorAction Stop
          $evidence = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ccb-native-probe') -ErrorAction Stop
          @("TEMP=$($testTemp.FullName)", "TMP=$($testTemp.FullName)") | Add-Content $env:GITHUB_ENV -Encoding utf8
          [ordered]@{ source=(git rev-parse HEAD); run=$env:GITHUB_RUN_ID; graphicalTestMode=$true; userInteractive=[Environment]::UserInteractive; processSession=(Get-Process -Id $PID).SessionId; scope='Only remaining14 original synthetic graphical cases on cloud runner; no installer, real provider, user profile or physical audio acceptance' } | ConvertTo-Json | Set-Content (Join-Path $evidence 'source.json') -Encoding utf8
      - name: Execute only remaining original graphical cases, preserving their native and foreground guards
        shell: pwsh
        working-directory: app
        env:
          CCB_FORMAT_AI_REVIEW_DIR: ${{ runner.temp }}/ccb-native-probe/images
        run: |
          .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=false --no-daemon --stacktrace --console=plain `
            --tests 'com.example.chatbar.desktop.DesktopCurrentImagePresentationTest.tool window exposes resize maximize and close without duplicating content title' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerNativeUxTest.native persistent scrollbar drags current page and explicit page jump preserves request semantics' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerNativeUxTest.native Stop is top layer visible and operable during download generation and long Windows playback' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerNativeUxTest.native Escape closes exactly one panel then picker with and without field focus at both widths' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerNativeUxTest.native resize retains target text and generated cache while sample identity stays distinct' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerWindowTest.identity scoped overlapping leases restore once in either order and remove callbacks' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerWindowTest.public main WindowScope supplies exact owner through maximize restore reopen and parent close' `
            --tests 'com.example.chatbar.desktop.DesktopFishPickerWindowTest.missing explicit main owner fails closed without composing picker content' `
            --tests 'com.example.chatbar.desktop.WindowsBackgroundViewerTest.background library double click viewer accepts native input and returns to unchanged library' `
            --tests 'com.example.chatbar.desktop.WindowsBackgroundViewerTest.real chat click opens repeated path in clicked message and navigates all occurrences' `
            --tests 'com.example.chatbar.desktop.WindowsImageViewerChromeTest.production viewer and owned screenshot have themed captions and real minimize maximize restore' `
            --tests 'com.example.chatbar.desktop.WindowsImageWindowMinimumTest.owned image dialog keeps its original minimum through native chrome and unhooks cleanly' `
            --tests 'com.example.chatbar.desktop.WindowsStudioEdgeDragTest.maximized Studio outer edges remain stationary and restore remains resizable' `
            --tests 'com.example.chatbar.desktop.WindowsWindowChromeTest.real Compose HWND preserves native contracts and unhooks on dispose'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual original XML and runner scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-probe-reports
          path: |
            app/desktopApp/build/test-results/test/
            app/desktopApp/build/reports/tests/test/
            ${{ runner.temp }}/ccb-native-probe/
          if-no-files-found: error
