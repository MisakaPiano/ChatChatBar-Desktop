name: Android editor and archive UI review
on:
  push:
    branches: [validation/editor-archive-ui-20261118]
concurrency:
  group: editor-archive-ui
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CHATBAR_VERSION_NAME: 1.4.12-ui-review-n1
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/editor_archive_ui.py /tmp/editor_archive_ui.py
      - uses: actions/checkout@v4
        with:
          ref: 2d4a899c02dec280c637cbfab5f4c9c8835cf053
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python /tmp/editor_archive_ui.py prepare
      - name: JVM compile and standard package
        run: python /tmp/editor_archive_ui.py jvm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Standard package UI API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/editor_archive_ui.py native-api30
      - name: Standard package UI API26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/editor_archive_ui.py native-api26
      - name: Build separate review app
        run: python /tmp/editor_archive_ui.py prepare-review-apk
      - name: Review package API30 smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/editor_archive_ui.py review-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-archive-ui-originals
          path: editor-archive-ui/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CCB-ui-review-n1-apk
          path: review-apk/CCB-ui-review-n1.apk
          retention-days: 14
