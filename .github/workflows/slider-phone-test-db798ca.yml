name: Slider phone test APK
on:
  push:
    branches: [ci/upstream-slider-phone-db798ca-20261108]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: db798ca6df45dd6d0f962db2d0ece5b1316bd0b0
  TEST_APPLICATION_ID: com.example.chatbar.slidertest.db798ca
  CHATBAR_SILICONFLOW_API_KEY: ''
  CHATBAR_SUPABASE_URL: ''
  CHATBAR_SUPABASE_ANON_KEY: ''
  CHATBAR_SUPABASE_REDIRECT_URI: chatbar-slidertest-db798ca://auth/callback
jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db798ca6df45dd6d0f962db2d0ece5b1316bd0b0
          persist-credentials: false
      - name: Verify immutable contribution source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set co-install test identity only
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          gradle = Path('app/app/build.gradle.kts')
          text = gradle.read_text()
          old = 'applicationId = "com.example.chatbar"'
          assert text.count(old) == 1
          gradle.write_text(text.replace(old, 'applicationId = "' + os.environ['TEST_APPLICATION_ID'] + '"'))
          manifest = Path('app/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          old_label = 'android:label="@string/app_name"'
          old_scheme = 'android:scheme="chatbar"'
          assert text.count(old_label) == 1 and text.count(old_scheme) == 1
          text = text.replace(old_label, 'android:label="CCB 滑块测试 db798ca"')
          text = text.replace(old_scheme, 'android:scheme="chatbar-slidertest-db798ca"')
          manifest.write_text(text)
          PY
      - name: Build installable debug test APK
        working-directory: app
        run: bash ./gradlew :app:assembleDebug -PCHATBAR_VERSION_NAME=1.4.10-slider-db798ca --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8'
      - name: Verify package, signature and exact build scope
        run: |
          mkdir -p phone-test-output
          cp app/app/build/outputs/apk/debug/app-debug.apk phone-test-output/CCB-slider-db798ca-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging phone-test-output/CCB-slider-db798ca-test.apk > phone-test-output/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree phone-test-output/CCB-slider-db798ca-test.apk AndroidManifest.xml > phone-test-output/apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs phone-test-output/CCB-slider-db798ca-test.apk > phone-test-output/apk-signature.txt
          python3 - <<'PY'
          import os, json, hashlib, subprocess
          from pathlib import Path
          out = Path('phone-test-output')
          apk = out / 'CCB-slider-db798ca-test.apk'
          badging = (out / 'apk-badging.txt').read_text()
          manifest = (out / 'apk-manifest.txt').read_text()
          assert "name='" + os.environ['TEST_APPLICATION_ID'] + "'" in badging
          assert "versionName='1.4.10-slider-db798ca'" in badging
          assert 'CCB 滑块测试 db798ca' in badging
          assert os.environ['TEST_APPLICATION_ID'] + '.fileprovider' in manifest
          assert 'chatbar-slidertest-db798ca' in manifest
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert set(changed) == {'app/app/build.gradle.kts','app/app/src/main/AndroidManifest.xml'}
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert source == os.environ['SOURCE_SHA']
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256.txt').write_text(digest + '  ' + apk.name + '\n')
          info = {'source': source, 'sourceTree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'applicationId':os.environ['TEST_APPLICATION_ID'], 'label':'CCB 滑块测试 db798ca',
                  'versionName':'1.4.10-slider-db798ca','variant':'debug','apk':apk.name,'bytes':apk.stat().st_size,
                  'sha256':digest,'buildOnlyChanges':changed,'identityOnly':True,
                  'tests':'Reuse source-db798ca scoped11unit+6controls; no test rerun in this packaging job',
                  'upstreamKnownFailure':'PromptAssemblerCharacterModeTest line127 reproduced on c84 baseline; not modified or hidden',
                  'privateKeysOrUserDataInjected':False,'installedOnDevice':False,
                  'cloudRun':'https://github.com/MisakaPiano/ChatChatBar-Desktop/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          (out / 'BUILD_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2))
          print(json.dumps(info,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: slider-phone-test-db798ca-${{ github.run_id }}
          path: phone-test-output/
          retention-days: 14
