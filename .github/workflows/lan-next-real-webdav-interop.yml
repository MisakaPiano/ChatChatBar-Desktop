name: Fixed CCB client interoperability with official rclone WebDAV
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths: [.github/lan-next-real-webdav-interop-request.json]
permissions:
  contents: read
jobs:
  real-webdav-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fixed source and prepare one exclusive test-only overlay
        shell: bash
        run: |
          source_sha=$(python3 -B tools/lan-next-control/real_webdav_interop_control.py validate --request .github/lan-next-real-webdav-interop-request.json)
          test "$source_sha" = 6ab083be4ee3de70757b06ea75ba49a77c558385
          source_dir="$RUNNER_TEMP/ccb-real-webdav-fixed-source"
          evidence_dir="$RUNNER_TEMP/ccb-real-webdav-reports"
          git worktree add --detach "$source_dir" "$source_sha"
          python3 -B tools/lan-next-control/real_webdav_interop_control.py prepare --request .github/lan-next-real-webdav-interop-request.json --source-dir "$source_dir" --output "$evidence_dir"
          echo "CCB_REAL_DAV_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "CCB_REAL_DAV_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pinned independent server and one actual CCB chunk read/write method
        shell: bash
        run: python3 -B tools/lan-next-control/real_webdav_interop_control.py run --request .github/lan-next-real-webdav-interop-request.json --source-dir "$CCB_REAL_DAV_SOURCE_DIR" --output "$CCB_REAL_DAV_EVIDENCE_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccb-real-webdav-rclone-interop-reports
          path: |
            ${{ runner.temp }}/ccb-real-webdav-reports/prepared.json
            ${{ runner.temp }}/ccb-real-webdav-reports/execution.json
            ${{ runner.temp }}/ccb-real-webdav-reports/runner-stdout.txt
            ${{ runner.temp }}/ccb-real-webdav-reports/runner-stderr.txt
            ${{ runner.temp }}/ccb-real-webdav-reports/rclone-version.txt
            ${{ runner.temp }}/ccb-real-webdav-reports/rclone-archive-manifest.json
            ${{ runner.temp }}/ccb-real-webdav-reports/real-webdav-method-counts.json
            ${{ runner.temp }}/ccb-real-webdav-reports/TEST-com.example.chatbar.domain.syncStoreProof.RealWebDavInteropSmokeTest.xml
          if-no-files-found: error
          retention-days: 14
