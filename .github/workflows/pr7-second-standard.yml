name: PR7 second review standard package
on:
  push:
    branches: [validation/pr7-second-review-20261116]
permissions:
  contents: read
jobs:
  standard:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHATBAR_VERSION_NAME: 1.4.12-pr7-second-standard
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/pr7_second_review.py /tmp/pr7_second_review.py
      - uses: actions/checkout@v4
        with:
          ref: 6bed9de48eb92df664a19901cd3193f7f5301417
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify unmodified standard application ID
        shell: python
        run: |
          import pathlib,subprocess,json
          root=pathlib.Path.cwd();out=root/'pr7-second-review';out.mkdir()
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source=='6bed9de48eb92df664a19901cd3193f7f5301417'
          assert 'applicationId = "com.example.chatbar"' in (root/'app/app/build.gradle.kts').read_text()
          (out/'source.json').write_text(json.dumps(dict(source=source,standardPackage=True,syntheticOnly=True,realAccountCalls=False)))
          wrapper=root/'app/gradlew';wrapper.chmod(wrapper.stat().st_mode|0o111)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Standard package actual retry and local redo controls API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_second_review.py fixed-native-standard-api30
      - run: python /tmp/pr7_second_review.py package-metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-second-standard-originals
          path: |
            pr7-second-review/
            app/app/build/outputs/androidTest-results/
          retention-days: 14
