name: PR7 segment removal voice cleanup
on:
  push:
    branches: [validation/pr7-segment-voice-20261118]
concurrency:
  group: pr7-segment-voice
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MisakaPiano/ChatChatBar-Desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CHATBAR_VERSION_NAME: 1.4.12-pr7-segment-voice
      CHATBAR_SUPABASE_URL: https://synthetic.invalid
      CHATBAR_SUPABASE_ANON_KEY: synthetic-no-real-key
    steps:
      - uses: actions/checkout@v4
      - run: cp validation/pr7_segment_voice.py /tmp/pr7_segment_voice.py
      - uses: actions/checkout@v4
        with:
          ref: efa6ffbb20cfc52096f0f5df03b41c419fc14e4a
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python /tmp/pr7_segment_voice.py prepare
      - name: Validate regression JVM and compile native tests
        run: |
          python /tmp/pr7_segment_voice.py fixed-jvm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce missing segment deletion cleanup on original VM API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_segment_voice.py baseline-native
      - name: Voice cleanup cold backup and previous controls API30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_segment_voice.py fixed-native-api30
      - name: Voice cleanup cold backup and previous controls API26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          profile: pixel_2
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python /tmp/pr7_segment_voice.py fixed-native-api26
      - run: python /tmp/pr7_segment_voice.py package-metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-segment-voice-originals
          path: |
            pr7-segment-voice/
            app/app/build/reports/tests/
            app/app/build/outputs/androidTest-results/
          retention-days: 14
