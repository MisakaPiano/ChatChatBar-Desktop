name: Desktop declared action options
on:
  push:
    branches: [codex/desktop-action-options-20261119, codex/desktop-action-options-review-proof-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-action-options-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind canonical synthetic temporary directory and source proof
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ccb-action-options'
          New-Item -ItemType Directory -Path $folder | Out-Null
          Add-Type 'using System.Text; using System.Runtime.InteropServices; public static class ActionRuleFixturePath { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetLongPathName(string path, StringBuilder result, uint size); }'
          $buffer = New-Object System.Text.StringBuilder 32768
          if ([ActionRuleFixturePath]::GetLongPathName($folder, $buffer, 32768) -eq 0) { throw 'FIXTURE_NATIVE_PATH_UNCONFIRMED' }
          "TEMP=$buffer" >> $env:GITHUB_ENV
          "TMP=$buffer" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path 'review-action-options' | Out-Null
          git rev-parse HEAD | Set-Content 'review-action-options/source.txt'
      - name: Check out exact prior product independently
        uses: actions/checkout@v4
        with:
          ref: e26a6ea00fe19c6e145ae0402eb08603f71193de
          path: prior-product
          persist-credentials: false
      - name: Reproduce raw menus entering the actual memory request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'app/desktopApp/src/test/kotlin/com/example/chatbar/desktop/DesktopActionMemoryPriorRegressionTest.kt'
          Copy-Item -LiteralPath $test -Destination (Join-Path 'prior-product' $test)
          git -C prior-product rev-parse HEAD | Set-Content 'review-action-options/negative-product-source.txt'
          Push-Location 'prior-product/app'
          try {
            .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopActionMemoryPriorRegressionTest' -PdesktopTestHeadless=true --no-daemon --stacktrace
            $negativeExit = $LASTEXITCODE
          } finally { Pop-Location }
          $path = 'prior-product/app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopActionMemoryPriorRegressionTest.xml'
          [xml]$report = Get-Content -Raw -LiteralPath $path
          if ($negativeExit -ne 1 -or $report.testsuite.tests -ne '1' -or $report.testsuite.failures -ne '1' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'ACTION_MEMORY_PRIOR_ASSERTION_NOT_REACHED' }
          if ($report.testsuite.testcase.failure.message -notlike '*Unchosen action menus entered the actual episode request*') { throw 'ACTION_MEMORY_PRIOR_WRONG_FAILURE' }
          Copy-Item -LiteralPath $path -Destination 'review-action-options/negative-memory-request.xml'
          $global:LASTEXITCODE = 0 # The validated expected Gradle failure is successful control evidence.
      - name: Reproduce mixed historical owners collapsing under real named UPDATE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = '9a2bc6f7f6361d06d0d93a854eb67deb5d1293c7'
          $file = 'app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/backup/DesktopMergeGraphRemapper.kt'
          git fetch origin $prior --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'MIXED_OWNER_PRIOR_UNAVAILABLE' }
          try {
            git restore --source=$prior --worktree -- $file
            Push-Location app
            try {
              .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.backup.DesktopMergeRestoreModesTest.named UPDATE cannot collapse selected and unselected historical memory owners into its target' -PdesktopTestHeadless=true --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            $path = 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.backup.DesktopMergeRestoreModesTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $path
            if ($negativeExit -ne 1 -or $report.testsuite.tests -ne '1' -or $report.testsuite.failures -ne '1' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'MIXED_OWNER_PRIOR_ASSERTION_NOT_REACHED' }
            if ($report.testsuite.testcase.failure.message -notlike '*Distinct historical owners collapsed*') { throw 'MIXED_OWNER_PRIOR_WRONG_FAILURE' }
            Copy-Item -LiteralPath $path -Destination 'review-action-options/negative-mixed-owner.xml'
            $prior | Set-Content 'review-action-options/negative-mixed-owner-source.txt'
          } finally {
            git restore --source=HEAD --worktree -- $file
            git diff --exit-code -- $file
            if ($LASTEXITCODE -ne 0) { throw 'MIXED_OWNER_POSITIVE_NOT_RESTORED' }
          }
      - name: Reproduce strict optional-legacy lookup refusing a legitimate restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = 'c68cd2c6e18241899e14ad745b117f5d0d522c2f'
          $file = 'app/sharedCore/src/main/kotlin/com/example/chatbar/domain/memory/LongTermMemoryService.kt'
          git fetch origin $prior --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'OPTIONAL_LEGACY_PRIOR_UNAVAILABLE' }
          try {
            git restore --source=$prior --worktree -- $file
            if ($LASTEXITCODE -ne 0) { throw 'OPTIONAL_LEGACY_PRIOR_NOT_RESTORED' }
            Push-Location app
            try {
              .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopMemoryLifecycleTest.optional legacy lookup accepts missing candidates but still refuses corrupt existing records' -PdesktopTestHeadless=true --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            $path = 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopMemoryLifecycleTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $path
            if ($negativeExit -ne 1 -or $report.testsuite.tests -ne '1' -or $report.testsuite.failures -ne '1' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'OPTIONAL_LEGACY_PRIOR_ASSERTION_NOT_REACHED' }
            if ($report.testsuite.testcase.failure.message -notlike '*Missing optional legacy node was refused*') { throw 'OPTIONAL_LEGACY_PRIOR_WRONG_FAILURE' }
            Copy-Item -LiteralPath $path -Destination 'review-action-options/negative-optional-legacy.xml'
            $prior | Set-Content 'review-action-options/negative-optional-legacy-source.txt'
          } finally {
            git restore --source=HEAD --worktree -- $file
            git diff --exit-code -- $file
            if ($LASTEXITCODE -ne 0) { throw 'OPTIONAL_LEGACY_POSITIVE_NOT_RESTORED' }
          }
      - name: Reproduce lost live orphan evidence through actual file restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = '20a63180b0caa105422f08f3d1df313f5da201dc'
          $file = 'app/desktopApp/src/main/kotlin/com/example/chatbar/desktop/DesktopSaveSlotService.kt'
          git fetch origin $prior --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'LIVE_MEMORY_PRIOR_UNAVAILABLE' }
          try {
            git restore --source=$prior --worktree -- $file
            if ($LASTEXITCODE -ne 0) { throw 'LIVE_MEMORY_PRIOR_NOT_RESTORED' }
            Push-Location app
            try {
              .\gradlew.bat :desktopApp:test --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest.actual restore retains same ID orphan withholding outside the safety snapshot' --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest.actual restore refuses corrupt same ID live memory before isolated publication' --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest.same session v3 inline restoration retains live withholding after node normalization' -PdesktopTestHeadless=true --no-daemon --stacktrace
              $negativeExit = $LASTEXITCODE
            } finally { Pop-Location }
            $path = 'app/desktopApp/build/test-results/test/TEST-com.example.chatbar.desktop.DesktopSaveSlotServiceTest.xml'
            [xml]$report = Get-Content -Raw -LiteralPath $path
            if ($negativeExit -ne 1 -or $report.testsuite.tests -ne '3' -or $report.testsuite.failures -ne '3' -or $report.testsuite.errors -ne '0' -or $report.testsuite.skipped -ne '0') { throw 'LIVE_MEMORY_PRIOR_ASSERTIONS_NOT_REACHED' }
            $expected = @('Live orphan withholding was lost during isolated restoration', 'Corrupt live candidate was overwritten during isolated restoration', 'V3 normalization must not erase the live legacy origin exclusion')
            foreach ($message in $expected) {
              if (-not ($report.testsuite.testcase.failure.message | Where-Object { $_ -like "*$message*" })) { throw 'LIVE_MEMORY_PRIOR_WRONG_FAILURE' }
            }
            Copy-Item -LiteralPath $path -Destination 'review-action-options/negative-live-memory.xml'
            $prior | Set-Content 'review-action-options/negative-live-memory-source.txt'
          } finally {
            git restore --source=HEAD --worktree -- $file
            git diff --exit-code -- $file
            if ($LASTEXITCODE -ne 0) { throw 'LIVE_MEMORY_POSITIVE_NOT_RESTORED' }
          }
      - name: Verify shared declared rule transport and projections
        working-directory: app
        run: >-
          .\gradlew.bat :sharedCore:test
          --tests 'com.example.chatbar.domain.chat.ActionOptionsFormatTest'
          --tests 'com.example.chatbar.domain.chat.ActionOptionsDeclaredFenceCompatibilityTest'
          --tests 'com.example.chatbar.domain.chat.RoleplayActionOptionsPolicyTest'
          --tests '*ActionProjectionParityTest'
          --tests 'com.example.chatbar.domain.rag.ChatMemoryIndexPolicyTest'
          --tests 'com.example.chatbar.domain.chat.ChatHistoryActionProjectionTest'
          --tests 'com.example.chatbar.domain.chat.MessageAlternativeVersionPolicyTest'
          --tests 'com.example.chatbar.domain.image.NovelAiActionOptionsProjectionTest'
          --tests 'com.example.chatbar.domain.voice.VoiceAnchorPolicyTest'
          --tests 'com.example.chatbar.domain.voice.VoiceGenerationPolicyTest'
          --tests 'com.example.chatbar.domain.voice.VoiceMessageVersionPolicyTest'
          --tests 'com.example.chatbar.domain.card.FormatCardTransferServiceTest'
          --tests 'com.example.chatbar.domain.card.CharacterCardTransferCoreTest'
          --tests 'com.example.chatbar.domain.card.FormatCardAutoFillGeneratorTest'
          --no-daemon --stacktrace
      - name: Verify actual Desktop rule ownership and UI
        working-directory: app
        env:
          CCB_ACTION_RULE_REVIEW_DIR: ${{ github.workspace }}/review-action-options
        run: >-
          .\gradlew.bat :desktopApp:test
          --tests 'com.example.chatbar.desktop.DesktopActionChoicesTest'
          --tests 'com.example.chatbar.desktop.DesktopActionOptionsFormatIntegrationTest'
          --tests 'com.example.chatbar.desktop.DesktopActionOptionsRequestTest'
          --tests 'com.example.chatbar.desktop.DesktopPrimaryChatPresentationTest'
          --tests 'com.example.chatbar.desktop.DesktopFormatCardEditorControllerTest'
          --tests 'com.example.chatbar.desktop.DesktopMessageFormatRepairTest'
          --tests 'com.example.chatbar.desktop.DesktopAutomaticFormatRepairTest'
          --tests 'com.example.chatbar.desktop.DesktopFishGenerationTest'
          --tests 'com.example.chatbar.desktop.DesktopRegenerationTest'
          --tests 'com.example.chatbar.desktop.DesktopActionMemoryPriorRegressionTest'
          --tests 'com.example.chatbar.desktop.DesktopChatMemoryIndexTest'
          --tests 'com.example.chatbar.desktop.DesktopMemoryInjectionTransportTest'
          --tests 'com.example.chatbar.desktop.DesktopMemorySafetyTest'
          --tests 'com.example.chatbar.desktop.DesktopMemoryLifecycleTest'
          --tests 'com.example.chatbar.desktop.backup.DesktopMergeGraphRemapperTest'
          --tests 'com.example.chatbar.desktop.backup.DesktopMergeRestoreModesTest'
          --tests 'com.example.chatbar.desktop.backup.DesktopMergeGraphRemapperTest'
          --tests 'com.example.chatbar.desktop.DesktopSaveSlotInspectorTest'
          --tests 'com.example.chatbar.desktop.DesktopSaveSlotServiceTest'
          --tests 'com.example.chatbar.desktop.DesktopFullBackupServiceTest.modern backup staging retains format declaration and active reply alternatives'
          -PdesktopTestHeadless=true --no-daemon --stacktrace
      # Keep the Android compatibility facade under its actual module compiler.
      - name: Verify Android action repair facade
        working-directory: app
        run: >-
          .\gradlew.bat :app:testDebugUnitTest
          --tests 'com.example.chatbar.domain.prompt.PromptTemplatesTest.actionOptionsRepairFacadeUsesSharedAuthority'
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-action-options-original-results
          path: |
            app/desktopApp/build/test-results/test/
            app/sharedCore/build/test-results/test/
            app/app/build/test-results/testDebugUnitTest/
            review-action-options/
