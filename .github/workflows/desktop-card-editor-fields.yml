name: Desktop character editor fields and opening choice
on:
  push:
    branches: [codex/desktop-card-editor-gaps-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-card-editor-fields-${{ github.ref }}
  cancel-in-progress: true
jobs:
  affected-android-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the repository Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the two corrected Android compatibility contracts
        working-directory: app
        run: |
          mkdir -p "${{ runner.temp }}/card-editor-review"
          printf '{"source":"%s","run":"%s","syntheticOnly":true,"localInstall":false,"providerCalls":false,"scope":"two corrected Android contract fixtures","unchangedEvidenceSource":"fc39ab30e7b6a4cdf6c9e15678afb3e179d1a95a"}\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > "${{ runner.temp }}/card-editor-review/source.json"
          bash ./gradlew :app:testDebugUnitTest \
            --tests com.example.chatbar.domain.card.CharacterCardPackageTest \
            --tests com.example.chatbar.ui.chat.CurrentTurnMessageOrderTest \
            --no-daemon --stacktrace --console=plain
      - name: Preserve affected original test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-card-editor-fields-originals
          path: |
            app/app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/card-editor-review/
          if-no-files-found: error
