name: Desktop character editor fields and opening choice
on:
  push:
    branches: [codex/desktop-card-editor-gaps-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-card-editor-fields-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Enable long path checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select canonical synthetic test directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cardTestRoot = Join-Path ($env:SystemDrive + '\') ('c' + [Guid]::NewGuid().ToString('N').Substring(0, 7))
          New-Item -ItemType Directory -Path $cardTestRoot -ErrorAction Stop | Out-Null
          @("TEMP=$cardTestRoot", "TMP=$cardTestRoot") | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Verify shared choice, editor custody and real Compose flows
        working-directory: app
        shell: pwsh
        env:
          CCB_CARD_EDITOR_REVIEW_DIR: ${{ runner.temp }}/card-editor-review
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:CCB_CARD_EDITOR_REVIEW_DIR -Force | Out-Null
          @{ source = (git rev-parse HEAD); run = $env:GITHUB_RUN_ID; syntheticOnly = $true; localInstall = $false; providerCalls = $false } |
            ConvertTo-Json | Set-Content "$env:CCB_CARD_EDITOR_REVIEW_DIR/source.json" -Encoding utf8
          .\gradlew.bat :sharedCore:test --tests com.example.chatbar.domain.card.CharacterGreetingPolicyTest `
            --tests com.example.chatbar.domain.chat.CharacterSessionServiceTest `
            --tests com.example.chatbar.domain.draft.CharacterEditorDraftUiStateCodecTest --no-daemon --stacktrace --console=plain
          $sharedExit = $LASTEXITCODE
          .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=true `
            --tests com.example.chatbar.desktop.DesktopCardEditorFieldsTest `
            --tests com.example.chatbar.desktop.DesktopSessionGreetingTest `
            --tests com.example.chatbar.desktop.DesktopCardEditorFieldsUiTest `
            --tests com.example.chatbar.desktop.DesktopCharacterSessionIntegrationTest `
            --tests com.example.chatbar.desktop.DesktopCharacterEditorOrderTest `
            --tests com.example.chatbar.desktop.DesktopPrimaryChatDraftLifetimeTest `
            --tests com.example.chatbar.desktop.DesktopCharacterExportCompatibilityTest --no-daemon --stacktrace --console=plain
          if ($LASTEXITCODE -ne 0 -or $sharedExit -ne 0) { exit 1 }
      - name: Preserve exact synthetic reports and review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-card-editor-fields-originals
          path: |
            app/sharedCore/build/test-results/test/
            app/desktopApp/build/test-results/test/
            ${{ runner.temp }}/card-editor-review/
          if-no-files-found: error
