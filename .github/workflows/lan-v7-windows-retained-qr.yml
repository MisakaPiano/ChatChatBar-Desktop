name: V7 Windows retained recovery code and rendered QR
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths: [.github/workflows/lan-v7-windows-retained-qr.yml]
permissions:
  contents: read
jobs:
  retained-panel:
    runs-on: windows-latest
    timeout-minutes: 42
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exercise only the retained group and the new desktop panel QR assertions
        run: python -B tools/lan-next-control/v7_windows_retained_qr_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-windows-retained-qr-safe-result
          path: |
            v7-retained-qr-evidence/focused-result.json
            v7-retained-qr-evidence/component-seed.json
            v7-retained-qr-evidence/component-resume.json
            v7-retained-qr-evidence/component-cold_invite.json
          if-no-files-found: ignore
