name: Exact delivered83 to candidate84 four input build
on:
  push:
    branches: ['codex/lan-next-sync-control-*']
    paths: [.github/lan-delivered83-candidate84-build-request.json]
permissions:
  contents: read
  actions: read
jobs:
  four-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fixed83 to84 request and overlay only test companions
        shell: bash
        run: |
          candidate=$(python3 -B tools/lan-next-control/candidate84_build.py validate-request --request .github/lan-delivered83-candidate84-build-request.json)
          seed="$RUNNER_TEMP/ccb-candidate84-seed83-source"
          next="$RUNNER_TEMP/ccb-candidate84-source"
          git worktree add --detach "$seed" 90ead92410ca4c5e240f75d120ed6a145fb6f1c8
          git worktree add --detach "$next" "$candidate"
          python3 -B tools/lan-next-control/candidate84_build.py prepare --request .github/lan-delivered83-candidate84-build-request.json --seed-dir "$seed" --candidate-dir "$next" --output raw-inputs
          echo "CCB_LAN_SEED_SOURCE=$seed" >> "$GITHUB_ENV"
          echo "CCB_LAN_CANDIDATE_SOURCE=$next" >> "$GITHUB_ENV"
      - name: Authenticate original V4 raw83 API and complete original ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/lan-next-control/candidate84_build.py base-provenance --output raw-inputs/original83-artifact-provenance.json
          python3 -B tools/lan-next-control/candidate84_build.py fetch-base --archive "$RUNNER_TEMP/candidate84-original83.zip" --output original83
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build only seed companion against exact V4 source83
        working-directory: ${{ env.CCB_LAN_SEED_SOURCE }}/app
        run: bash ./gradlew :app:assembleLanPreviewAndroidTest -PlanSyncDeviceTests=true -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=83 --no-daemon --stacktrace
      - name: Build candidate84 production and separate verify companion
        working-directory: ${{ env.CCB_LAN_CANDIDATE_SOURCE }}/app
        run: bash ./gradlew :app:assembleLanPreview :app:assembleLanPreviewAndroidTest -PlanSyncDeviceTests=true -PlanSyncPreviewSeries=next -PlanSyncPreviewCode=84 --no-daemon --stacktrace
      - name: Inspect four actual inputs and preserve exact delivered83 lineage
        run: python3 -B tools/lan-next-control/candidate84_build.py collect --request .github/lan-delivered83-candidate84-build-request.json --seed-dir "$CCB_LAN_SEED_SOURCE" --candidate-dir "$CCB_LAN_CANDIDATE_SOURCE" --original-dir original83 --output raw-inputs --control-sha "$GITHUB_SHA" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ccb-lan-delivered83-candidate84-manifests
          path: raw-inputs/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ccb-lan-delivered83-candidate84-new-signing-inputs
          path: |
            raw-inputs/*.json
            raw-inputs/seed83-tests-input.apk
            raw-inputs/candidate84-input.apk
            raw-inputs/verify84-tests-input.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccb-lan-delivered83-candidate84-inputs
          path: raw-inputs/
          if-no-files-found: error
