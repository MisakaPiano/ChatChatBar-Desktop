name: Verify already-public1245 with frozen1233 client
on:
  push:
    branches: ['codex/desktop-public-client-1245-*']
    paths: ['.github/desktop-public1245/request.json']
permissions:
  contents: read
jobs:
  public-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Enable existing Windows long-path checkout support
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated hash-locked updater runtime without application build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path 'C:\' ('ccbpub-'+[guid]::NewGuid().ToString('N'))
          if(Test-Path -LiteralPath $base){throw 'NEW_CLOUD_BASE_REQUIRED'}
          New-Item -ItemType Directory -Path $base | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE 'public-client-reports') | Out-Null
          "CCB_PUBLIC_PROBE_BASE=$base" | Add-Content $env:GITHUB_ENV -Encoding utf8
          python -B tools/desktop/update/prepare_runtime.py --destination (Join-Path $base 'runtime') --artifact-cache (Join-Path $base 'artifact-cache') --download 1> public-client-reports/runtime-prepare-stdout.log 2> public-client-reports/runtime-prepare-stderr.log
          if($LASTEXITCODE -ne 0){throw 'LOCKED_RUNTIME_PREPARE_FAILED'}
      - name: Actual old client public discovery full download and second verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:CCB_PUBLIC_PROBE_BASE 'runtime\python.exe'
          & $python -B .github/desktop-public1245/validate-live-public1233.py 1> public-client-reports/client-stdout.log 2> public-client-reports/client-stderr.log
          if($LASTEXITCODE -ne 0){throw 'ACTUAL_PUBLIC_CLIENT_VALIDATION_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-public1245-frozen1233-reports
          path: public-client-reports/*
