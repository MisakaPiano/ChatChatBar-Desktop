name: Completed installation retirement regression
on:
  push:
    branches: ['codex/desktop-retirement-check-*']
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated test space and exact source receipt
        shell: pwsh
        run: |
          $p = Join-Path ($env:SystemDrive + '\') ('u' + [Guid]::NewGuid().ToString('N').Substring(0,7))
          New-Item -ItemType Directory -Path $p -ErrorAction Stop | Out-Null
          @("TEMP=$p", "TMP=$p") | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/cache-status-results" -Force | Out-Null
          @{ source = (git rev-parse HEAD); scope = 'Synthetic cache/UI and tiny native fixture executable/manager lifecycle only; no ordinary NSIS package, real user root, provider request, or public release' } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/cache-status-results/source.json"
      - name: Install synthetic signed-metadata test dependencies
        run: python -m pip install tuf==7.0.1 securesystemslib[crypto]==1.6.0 urllib3==2.8.0 PySocks==1.7.1
      - name: Exercise original cleanup protections and receipt-only classification
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path('tools/desktop/update').resolve()))
          import test_client
          names=[n for n in unittest.defaultTestLoader.getTestCaseNames(test_client.ClientTest) if n.startswith(('test_explicit_cleanup_', 'test_cleanup_', 'test_receipt_only_', 'test_unconfirmed_changed_', 'test_explicitly_selected_'))]
          suite=unittest.TestSuite(test_client.ClientTest(n) for n in names)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          pathlib.Path(os.environ['RUNNER_TEMP'],'cache-status-results/python.json').write_text(json.dumps(dict(tests=result.testsRun, failures=[n.id() for n,_ in result.failures], errors=[n.id() for n,_ in result.errors], skipped=[n.id() for n,_ in result.skipped], selected=names),indent=2))
          sys.exit(not result.wasSuccessful())
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native owned lifecycle and exact installer completion handoff
        shell: pwsh
        run: |
          python -B -m unittest discover -s tools/desktop/nsis -p test_lifecycle.py -v 2>&1 | Tee-Object "$env:RUNNER_TEMP/cache-status-results/lifecycle.log"
          $nativeExit = $LASTEXITCODE
          python -B -m unittest discover -s tools/desktop/update -p test_handoff.py -v 2>&1 | Tee-Object "$env:RUNNER_TEMP/cache-status-results/handoff.log"
          if ($nativeExit -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Compile actual UI owner and verify timestamped cleanup results
        working-directory: app
        run: .\gradlew.bat :desktopApp:test -PdesktopTestHeadless=true --no-daemon --stacktrace --console=plain --tests com.example.chatbar.desktop.DesktopUpdateCacheSummaryTest --tests com.example.chatbar.desktop.DesktopUpdateSpaceTest --tests com.example.chatbar.desktop.DesktopUpdateWorkOwnershipTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-original-results
          path: |
            ${{ runner.temp }}/cache-status-results/
            app/desktopApp/build/test-results/test/
          if-no-files-found: warn
