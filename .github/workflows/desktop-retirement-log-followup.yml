name: Retirement invocation log boundary
on:
  push:
    branches: ['codex/desktop-retirement-log-*']
permissions:
  contents: read
jobs:
  log-boundary:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check one-case multi-root current-invocation logs
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, sys, unittest
          sys.path.insert(0,str(pathlib.Path('tools/desktop/nsis').resolve()))
          import test_lifecycle
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([test_lifecycle.Lifecycle('test_program_cannot_be_nested_in_default_credentials_or_selected_data')]))
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'retirement-log');out.mkdir()
          (out/'original.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],tests=result.testsRun,failures=[dict(test=n.id(),traceback=t) for n,t in result.failures],errors=[dict(test=n.id(),traceback=t) for n,t in result.errors],skipped=[dict(test=n.id(),reason=t) for n,t in result.skipped],scope='One affected tiny-native multi-root diagnostic helper case; no ordinary app or installer'),indent=2))
          sys.exit(not result.wasSuccessful())
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-log-original
          path: ${{ runner.temp }}/retirement-log/
