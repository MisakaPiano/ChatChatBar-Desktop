name: Frozen1247 current Android shared-boundary compilation
on:
  push:
    branches: ['codex/desktop-integration-1247-*']
permissions:
  contents: read
jobs:
  android:
    name: Current Android compile only; previous588 unit scope retained separately
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdfa120207c402ee2af23118586568d875d1d54e
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install fixed project Android SDK requirements
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind this integration report to the frozen application source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $normal=git rev-parse HEAD
          if($normal -cne 'fdfa120207c402ee2af23118586568d875d1d54e'){throw 'FROZEN_fdfa120207c402ee2af23118586568d875d1d54e_MISMATCH'}
          $proof=Join-Path $env:RUNNER_TEMP 'integration-source.json'
          @{source=$normal; expected='fdfa120207c402ee2af23118586568d875d1d54e'; platform='${{ runner.os }}'; scope='synthetic integration only; no user roots/keys/archives'; public=$false} | ConvertTo-Json | Set-Content -LiteralPath $proof -Encoding utf8

      - name: Restore only the pinned public official compiler
        id: restoreCompiler
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccb-official-compiler-verified
          key: ccb-official-kotlin-2.3.20-976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337-v1-linux
      - name: Recover pinned compiler with bounded missing-range waves and full digest validation
        id: verifyCompiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'ccb-official-compiler-transport.py'
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,tempfile,time
          url='https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.3.20/kotlin-compiler-embeddable-2.3.20.jar'
          total=59718536
          sha1='002fac4210c52c27b244305d60b0906e831f49be'
          sha256='976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337'
          root=Path(os.environ['RUNNER_TEMP'])/'ccb-ui-probe/compiler-proof';root.mkdir(parents=True,exist_ok=True)
          gradle=Path(os.environ.get('GRADLE_USER_HOME',str(Path.home()/'.gradle')))/'caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.3.20'/sha1
          target=gradle/'kotlin-compiler-embeddable-2.3.20.jar'
          verifiedRoot=Path(os.environ['RUNNER_TEMP'])/'ccb-official-compiler-verified'
          retained=verifiedRoot/'compiler.jar'
          proof={'officialUrl':url,'expectedBytes':total,'expectedSha1':sha1,'expectedSha256':sha256,'sourceOrDependencyRepositoryChanged':False,'parts':[],'wavesBound':2,'totalSecondsBound':600,'verified':False}
          def verified(path):
              if not path.is_file()or path.stat().st_size!=total:return False
              data=path.read_bytes()
              return hashlib.sha1(data).hexdigest()==sha1 and hashlib.sha256(data).hexdigest()==sha256
          try:
              if verified(target):
                  proof['cacheReuse']='verified-gradle-file'
              elif retained.exists():
                  if not verified(retained):raise RuntimeError('RESTORED_OFFICIAL_COMPILER_DIGEST_MISMATCH')
                  gradle.mkdir(parents=True,exist_ok=True);shutil.copyfile(retained,target)
                  proof['cacheReuse']='independently-reverified-official-only-cache'
              else:
                  if target.exists():raise RuntimeError('EXISTING_COMPILER_CACHE_DIGEST_MISMATCH')
                  deadline=time.monotonic()+600
                  starts=list(range(0,total,2*1024*1024));ready={}
                  with tempfile.TemporaryDirectory(prefix='ccb-official-ranges-',dir=os.environ['RUNNER_TEMP'])as tmp:
                      stage=Path(tmp);whole=stage/'compiler.jar';fullResponse=False
                      for wave in range(1,3):
                          for start in starts:
                              if start in ready:continue
                              left=deadline-time.monotonic()
                              if left<1:raise RuntimeError('OFFICIAL_COMPILER_RANGE_TOTAL_DEADLINE')
                              end=min(start+2*1024*1024-1,total-1)
                              part=stage/('part-'+str(start));headers=stage/('headers-'+str(start))
                              query='?ccbSegment='+str(start)+('' if wave==1 else '&ccbRangeRetry='+str(wave))
                              result=subprocess.run(['curl','--fail','--silent','--show-error','--location','--connect-timeout',str(min(20,max(1,int(left)))),'--max-time',str(min(60,max(1,int(left)))),'--range',str(start)+'-'+str(end),'--dump-header',str(headers),'--output',str(part),url+query])
                              size=part.stat().st_size if part.exists()else 0
                              header=headers.read_text(encoding='utf-8',errors='replace').lower()if headers.exists()else''
                              matched=('content-range: bytes '+str(start)+'-'+str(end)+'/'+str(total))in header
                              row={'wave':wave,'start':start,'end':end,'exitCode':result.returncode,'bytes':size,'contentRangeMatched':matched}
                              proof['parts'].append(row)
                              if result.returncode==0 and start==0 and size==total and verified(part):
                                  shutil.copyfile(part,whole);fullResponse=True;break
                              if result.returncode==0 and size==end-start+1 and matched:
                                  ready[start]=part;row['partSha256']=hashlib.sha256(part.read_bytes()).hexdigest()
                              else:
                                  print('OFFICIAL_RANGE_ATTEMPT_REFUSED wave='+str(wave)+' start='+str(start)+' exit='+str(result.returncode),flush=True)
                          if fullResponse or len(ready)==len(starts):break
                      if not fullResponse:
                          if len(ready)!=len(starts):raise RuntimeError('OFFICIAL_COMPILER_MISSING_RANGES_'+str(len(starts)-len(ready)))
                          with whole.open('wb')as combined:
                              for start in starts:combined.write(ready[start].read_bytes())
                      if not verified(whole):raise RuntimeError('OFFICIAL_COMPILER_FINAL_DIGEST_MISMATCH')
                      gradle.mkdir(parents=True,exist_ok=True);shutil.copyfile(whole,target)
                      proof['reusedSuccessfulRangesWithinJob']=True
              if not verified(target):raise RuntimeError('OFFICIAL_COMPILER_GRADLE_COPY_MISMATCH')
              verifiedRoot.mkdir(parents=True,exist_ok=True)
              if not retained.exists():shutil.copyfile(target,retained)
              if not verified(retained):raise RuntimeError('OFFICIAL_COMPILER_RETAINED_COPY_MISMATCH')
              proof.update(actualBytes=target.stat().st_size,actualSha1=hashlib.sha1(target.read_bytes()).hexdigest(),actualSha256=hashlib.sha256(target.read_bytes()).hexdigest(),verified=True)
          finally:
              (root/'compiler-transport-proof.json').write_text(json.dumps(proof,indent=2),encoding='utf-8')
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          python $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only the fully verified public compiler for subsequent focused jobs
        if: steps.verifyCompiler.outcome == 'success' && steps.restoreCompiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccb-official-compiler-verified
          key: ccb-official-kotlin-2.3.20-976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337-v1-linux
      - name: Compile current Android production and instrumented-test sources without device or unit rerun
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration1247-android-current-compile-r04
          path: |
            ${{ runner.temp }}/integration-source.json
            ${{ runner.temp }}/ccb-ui-probe/compiler-proof/
            app/app/build/test-results/
            app/app/build/reports/tests/
